r::CONTENT_TYPE, HeaderValue::from_static(\"text/html\"));\n                (StatusCode::OK, headers, html).into_response()\n            }\n        }),\n    );\n    serve(app).await\n}\n\n#[tokio::test]\nasync fn test_crawl_depth_zero() {\n    let html = r#\"\u003chtml\u003e\u003cbody\u003e\u003ca href=\"/page1\"\u003ePage 1\u003c/a\u003e\u003c/body\u003e\u003c/html\u003e\"#.to_string();\n    let (addr, _handle) = start_simple_site(html).await;\n    let url = Url::parse(\u0026format!(\"http://{}/\", addr)).unwrap();\n    let client = reqwest::Client::new();\n    \n    let result = crawl(\u0026client, \u0026url, 0, 4, false, false).await.unwrap();\n    \n    // Depth 0 means we only crawl the root page, no following links\n    assert_eq!(result.pages_crawled, 1, \"Should only crawl the root page\");\n    assert_eq!(result.pages.len(), 1, \"Should have exactly 1 page\");\n}\n\n#[tokio::test]\nasync fn test_crawl_depth_one() {\n    let html = r#\"\u003chtml\u003e\u003cbody\u003e\u003ch1\u003eHome\u003c/h1\u003e\u003ca href=\"/page1\"\u003ePage 1\u003c/a\u003e\u003ca href=\"/page2\"\u003ePage 2\u003c/a\u003e\u003c/body\u003e\u003c/html\u003e\"#;\n    let (addr, _handle) = start_simple_site(html.to_string()).await;\n    let url = Url::parse(\u0026format!(\"http://{}/\", addr)).unwrap();\n    let client = reqwest::Client::new();\n    \n    let result = crawl(\u0026client, \u0026url, 1, 4, false, false).await.unwrap();\n    \n    // Depth 1: crawl root + immediate links\n    // Note: pages might 404, but should attempt to crawl them\n    assert!(result.pages_crawled \u003e= 1, \"Should crawl at least the root page\");\n    assert!(result.pages.len() \u003e= 1, \"Should have at least 1 page\");\n}\n\n#[tokio::test]\nasync fn test_crawl_external_links_not_checked() {\n    let html = r#\"\u003chtml\u003e\u003cbody\u003e\u003ca href=\"https://external.example.com\"\u003eExternal\u003c/a\u003e\u003ca href=\"/internal\"\u003eInternal\u003c/a\u003e\u003c/body\u003e\u003c/html\u003e\"#;\n    let (addr, _handle) = start_simple_site(html.to_string()).await;\n    let url = Url::parse(\u0026format!(\"http://{}/\", addr)).unwrap();\n    let client = reqwest::Client::new();\n    \n    // check_externals = false\n    let result = crawl(\u0026client, \u0026url, 1, 4, false, false).await.unwrap();\n    \n    // Should crawl root + attempt /internal (which will 404)\n    assert!(result.pages_crawled \u003e= 1, \"Should crawl at least the root page\");\n    \n    // External links should be recorded but not crawled\n    let all_text = result.pages[0].text.as_ref().unwrap_or(\u0026String::new()).to_lowercase();\n    assert!(all_text.contains(\"external\") || all_text.contains(\"internal\"), \n            \"Should capture page content\");\n}\n\n#[tokio::test]\nasync fn test_crawl_external_links_checked() {\n    let html = r#\"\u003chtml\u003e\u003cbody\u003e\u003ca href=\"https://www.google.com\"\u003eGoogle\u003c/a\u003e\u003ca href=\"/internal\"\u003eInternal\u003c/a\u003e\u003c/body\u003e\u003c/html\u003e\"#;\n    let (addr, _handle) = start_simple_site(html.to_string()).await;\n    let url = Url::parse(\u0026format!(\"http://{}/\", addr)).unwrap();\n    let client = reqwest::Client::new();\n    \n    // check_externals = true - external links are validated but not crawled\n    let result = crawl(\u0026client, \u0026url, 1, 4, true, false).await.unwrap();\n    \n    // Should validate external links and crawl same-origin\n    assert!(result.links_checked \u003e= 1, \"Should check external links\");\n    assert!(result.pages_crawled \u003e= 1, \"Should crawl same-origin pages\");\n}\n\n#[tokio::test]\nasync fn test_crawl_with_fragments() {\n    let html = r#\"\u003chtml\u003e\u003cbody\u003e\u003ca href=\"/page#section1\"\u003eSection 1\u003c/a\u003e\u003ca href=\"/page#section2\"\u003eSection 2\u003c/a\u003e\u003c/body\u003e\u003c/html\u003e\"#;\n    let (addr, _handle) = start_simple_site(html.to_string()).await;\n    let url = Url::parse(\u0026format!(\"http://{}/\", addr)).unwrap();\n    let client = reqwest::Client::new();\n    \n    let result = crawl(\u0026client, \u0026url, 1, 4, false, false).await.unwrap();\n    \n    // Fragments should be normalized - both links point to same page\n    // Root + /page (which will 404) = 2 pages crawled\n    assert!(result.pages_crawled \u003e= 1, \"Should crawl root and attempt linked pages\");\n}\n\n#[tokio::test]\nasync fn test_crawl_broken_links() {\n    let html = r#\"\u003chtml\u003e\u003cbody\u003e\u003ca href=\"/exists\"\u003eGood\u003c/a\u003e\u003ca href=\"/broken404\"\u003eBad\u003c/a\u003e\u003c/body\u003e\u003c/html\u003e\"#;\n    let (addr, _handle) = start_simple_site(html.to_string()).await;\n    let url = Url::parse(\u0026format!(\"http://{}/\", addr)).unwrap();\n    let client = reqwest::Client::new();\n    \n    let result = crawl(\u0026client, \u0026url, 1, 4, false, false).await.unwrap();\n    \n    // Should detect broken links (404s)\n    // Note: without additional routes, both will 404\n    assert!(result.broken_links.len() \u003e= 1, \"Should detect broken links\");\n}\n\n#[tokio::test]\nasync fn test_crawl_respects_concurrency() {\n    let html = r#\"\u003chtml\u003e\u003cbody\u003e\n        \u003ca href=\"/p1\"\u003e1\u003c/a\u003e\u003ca href=\"/p2\"\u003e2\u003c/a\u003e\u003ca href=\"/p3\"\u003e3\u003c/a\u003e\n        \u003ca href=\"/p4\"\u003e4\u003c/a\u003e\u003ca href=\"/p5\"\u003e5\u003c/a\u003e\n    \u003c/body\u003e\u003c/html\u003e\"#;\n    let (addr, _handle) = start_simple_site(html.to_string()).await;\n    let url = Url::parse(\u0026format!(\"http://{}/\", addr)).unwrap();\n    let client = reqwest::Client::new();\n    \n    // Test with low concurrency\n    let result = crawl(\u0026client, \u0026url, 1, 2, false, false).await.unwrap();\n    \n    // Should complete without errors\n    assert!(result.pages_crawled \u003e= 1, \"Should complete crawl\");\n}\n\n#[tokio::test]\nasync fn test_crawl_circular_references() {\n    let html = r#\"\u003chtml\u003e\u003cbody\u003e\u003ca href=\"/\"\u003eSelf\u003c/a\u003e\u003ca href=\"/\"\u003eAgain\u003c/a\u003e\u003c/body\u003e\u003c/html\u003e\"#;\n    let (addr, _handle) = start_simple_site(html.to_string()).await;\n    let url = Url::parse(\u0026format!(\"http://{}/\", addr)).unwrap();\n    let client = reqwest::Client::new();\n    \n    let result = crawl(\u0026client, \u0026url, 2, 4, false, false).await.unwrap();\n    \n    // Should handle circular references without infinite loop\n    assert_eq!(result.pages_crawled, 1, \"Should not re-crawl same page\");\n}\n\n#[tokio::test]\nasync fn test_crawl_with_query_params() {\n    let html = r#\"\u003chtml\u003e\u003cbody\u003e\u003ca href=\"/?page=1\"\u003ePage 1\u003c/a\u003e\u003ca href=\"/?page=2\"\u003ePage 2\u003c/a\u003e\u003c/body\u003e\u003c/html\u003e\"#;\n    let (addr, _handle) = start_simple_site(html.to_string()).await;\n    let url = Url::parse(\u0026format!(\"http://{}/\", addr)).unwrap();\n    let client = reqwest::Client::new();\n    \n    let result = crawl(\u0026client, \u0026url, 1, 4, false, false).await.unwrap();\n    \n    // Query params make URLs unique\n    assert!(result.pages_crawled \u003e= 1, \"Should handle query parameters\");\n}\n\n#[tokio::test]\nasync fn test_crawl_relative_links() {\n    let html = r#\"\u003chtml\u003e\u003cbody\u003e\n        \u003ca href=\"/absolute\"\u003eAbsolute\u003c/a\u003e\n        \u003ca href=\"relative\"\u003eRelative\u003c/a\u003e\n        \u003ca href=\"../parent\"\u003eParent\u003c/a\u003e\n    \u003c/body\u003e\u003c/html\u003e\"#;\n    let (addr, _handle) = start_simple_site(html.to_string()).await;\n    let url = Url::parse(\u0026format!(\"http://{}/\", addr)).unwrap();\n    let client = reqwest::Client::new();\n    \n    let result = crawl(\u0026client, \u0026url, 1, 4, false, false).await.unwrap();\n    \n    // Should handle all types of relative URLs\n    assert!(result.pages_crawled \u003e= 1, \"Should parse relative URLs\");\n}\n\n#[tokio::test]\nasync fn test_crawl_empty_page() {\n    let html = r#\"\u003chtml\u003e\u003cbody\u003e\u003c/body\u003e\u003c/html\u003e\"#;\n    let (addr, _handle) = start_simple_site(html.to_string()).await;\n    let url = Url::parse(\u0026format!(\"http://{}/\", addr)).unwrap();\n    let client = reqwest::Client::new();\n    \n    let result = crawl(\u0026client, \u0026url, 1, 4, false, false).await.unwrap();\n    \n    assert_eq!(result.pages_crawled, 1, \"Should crawl empty page\");\n    assert_eq!(result.pages.len(), 1, \"Should have 1 page\");\n}\n\n#[tokio::test]\nasync fn test_crawl_marketing_signals() {\n    let html = r#\"\u003chtml\u003e\u003chead\u003e\n        \u003cmeta property=\"og:title\" content=\"Test\"\u003e\n        \u003cmeta name=\"twitter:card\" content=\"summary\"\u003e\n        \u003cscript type=\"application/ld+json\"\u003e{\"@type\": \"Article\"}\u003c/script\u003e\n    \u003c/head\u003e\u003cbody\u003e\u003cp\u003eContent\u003c/p\u003e\u003c/body\u003e\u003c/html\u003e\"#;\n    let (addr, _handle) = start_simple_site(html.to_string()).await;\n    let url = Url::parse(\u0026format!(\"http://{}/\", addr)).unwrap();\n    let client = reqwest::Client::new();\n    \n    let result = crawl(\u0026client, \u0026url, 0, 4, false, false).await.unwrap();\n    \n    assert_eq!(result.pages.len(), 1, \"Should have 1 page\");\n    let page = \u0026result.pages[0];\n    \n    if let Some(signals) = \u0026page.signals {\n        assert!(signals.open_graph_tags \u003e 0, \"Should detect OpenGraph tags\");\n        assert!(signals.twitter_tags \u003e 0, \"Should detect Twitter tags\");\n        assert!(signals.json_ld_blocks \u003e 0, \"Should detect JSON-LD\");\n    }\n}\n","traces":[],"covered":0,"coverable":0},{"path":["/","home","lquessenberry","Custom Apps","dexteri","tests","indexer_basic.rs"],"content":"use tempfile::TempDir;\nuse dexteri::indexer::{index_pages, search_index};\nuse dexteri::models::Page;\n\nfn create_sample_page(url: \u0026str, title: \u0026str, text: \u0026str) -\u003e Page {\n    Page {\n        url: url.to_string(),\n        status: Some(200),\n        title: Some(title.to_string()),\n        links: vec![],\n        content_type: Some(\"text/html\".to_string()),\n        bytes: Some(1024),\n        text: Some(text.to_string()),\n        signals: None,\n    }\n}\n\n#[tokio::test]\nasync fn test_index_empty_pages() {\n    let temp_dir = TempDir::new().unwrap();\n    let index_path = temp_dir.path().to_path_buf();\n    \n    let pages: Vec\u003cPage\u003e = vec![];\n    let result = index_pages(\u0026index_path, \u0026pages).await;\n    \n    assert!(result.is_ok());\n    let stats = result.unwrap();\n    assert_eq!(stats.docs_indexed, 0, \"Should index 0 pages\");\n}\n\n#[tokio::test]\nasync fn test_index_single_page() {\n    let temp_dir = TempDir::new().unwrap();\n    let index_path = temp_dir.path().to_path_buf();\n    \n    let pages = vec![create_sample_page(\n        \"https://example.com\",\n        \"Example Page\",\n        \"This is example content for indexing\"\n    )];\n    \n    let result = index_pages(\u0026index_path, \u0026pages).await;\n    assert!(result.is_ok());\n    \n    let stats = result.unwrap();\n    assert_eq!(stats.docs_indexed, 1, \"Should index 1 page\");\n}\n\n#[tokio::test]\nasync fn test_index_multiple_pages() {\n    let temp_dir = TempDir::new().unwrap();\n    let index_path = temp_dir.path().to_path_buf();\n    \n    let pages = vec![\n        create_sample_page(\"https://example.com/page1\", \"Page One\", \"Content for page one\"),\n        create_sample_page(\"https://example.com/page2\", \"Page Two\", \"Content for page two\"),\n    ];\n    \n    let result = index_pages(\u0026index_path, \u0026pages).await;\n    assert!(result.is_ok());\n    \n    let stats = result.unwrap();\n    assert_eq!(stats.docs_indexed, 2, \"Should index 2 pages\");\n}\n\n#[tokio::test]\nasync fn test_search_empty_index() {\n    let temp_dir = TempDir::new().unwrap();\n    let index_path = temp_dir.path().to_path_buf();\n    \n    let pages: Vec\u003cPage\u003e = vec![];\n    index_pages(\u0026index_path, \u0026pages).await.unwrap();\n    \n    let results = search_index(\u0026index_path, \"test\", 10);\n    assert!(results.is_ok());\n    \n    let hits = results.unwrap();\n    assert_eq!(hits.len(), 0, \"Empty index should return no results\");\n}\n\n#[tokio::test]\nasync fn test_search_finds_content() {\n    let temp_dir = TempDir::new().unwrap();\n    let index_path = temp_dir.path().to_path_buf();\n    \n    let pages = vec![\n        create_sample_page(\"https://example.com/rust\", \"Rust Programming\", \"Rust is a systems programming language\"),\n        create_sample_page(\"https://example.com/python\", \"Python Programming\", \"Python is a high-level language\"),\n    ];\n    \n    index_pages(\u0026index_path, \u0026pages).await.unwrap();\n    \n    let results = search_index(\u0026index_path, \"rust\", 10).unwrap();\n    assert!(results.len() \u003e 0, \"Should find results for 'rust'\");\n    assert!(results[0].url.contains(\"rust\") || \n            results[0].title.as_ref().map(|t| t.contains(\"Rust\")).unwrap_or(false), \n            \"Result should contain 'rust'\");\n}\n\n#[tokio::test]\nasync fn test_search_respects_limit() {\n    let temp_dir = TempDir::new().unwrap();\n    let index_path = temp_dir.path().to_path_buf();\n    \n    let pages: Vec\u003cPage\u003e = (0..10)\n        .map(|i| create_sample_page(\n            \u0026format!(\"https://example.com/page{}\", i),\n            \u0026format!(\"Page {}\", i),\n            \"common search term appears here\"\n        ))\n        .collect();\n    \n    index_pages(\u0026index_path, \u0026pages).await.unwrap();\n    \n    let results = search_index(\u0026index_path, \"common\", 3).unwrap();\n    assert!(results.len() \u003c= 3, \"Should respect search limit of 3\");\n}\n\n#[tokio::test]\nasync fn test_search_case_insensitive() {\n    let temp_dir = TempDir::new().unwrap();\n    let index_path = temp_dir.path().to_path_buf();\n    \n    let pages = vec![create_sample_page(\"https://example.com\", \"Example\", \"UPPERCASE content here\")];\n    \n    index_pages(\u0026index_path, \u0026pages).await.unwrap();\n    \n    let results = search_index(\u0026index_path, \"uppercase\", 10).unwrap();\n    assert!(results.len() \u003e 0, \"Search should be case-insensitive\");\n}\n\n#[tokio::test]\nasync fn test_search_nonexistent_term() {\n    let temp_dir = TempDir::new().unwrap();\n    let index_path = temp_dir.path().to_path_buf();\n    \n    let pages = vec![create_sample_page(\"https://example.com\", \"Example\", \"Some content\")];\n    \n    index_pages(\u0026index_path, \u0026pages).await.unwrap();\n    \n    let results = search_index(\u0026index_path, \"nonexistentxyz123\", 10).unwrap();\n    assert_eq!(results.len(), 0, \"Should return no results for non-existent term\");\n}\n\n#[tokio::test]\nasync fn test_index_pages_without_text() {\n    let temp_dir = TempDir::new().unwrap();\n    let index_path = temp_dir.path().to_path_buf();\n    \n    let pages = vec![\n        Page {\n            url: \"https://example.com\".to_string(),\n            status: Some(200),\n            title: Some(\"No Text\".to_string()),\n            links: vec![],\n            content_type: Some(\"text/html\".to_string()),\n            bytes: Some(1024),\n            text: None,\n            signals: None,\n        },\n    ];\n    \n    let result = index_pages(\u0026index_path, \u0026pages).await;\n    assert!(result.is_ok(), \"Should handle pages without text\");\n    \n    let stats = result.unwrap();\n    // Pages without text are not indexed\n    assert_eq!(stats.docs_indexed, 0, \"Should not index pages without text\");\n}\n","traces":[],"covered":0,"coverable":0},{"path":["/","home","lquessenberry","Custom Apps","dexteri","tests","ports_scanner.rs"],"content":"use std::sync::{\n    atomic::{AtomicBool, Ordering},\n    Arc,\n};\nuse tokio::net::TcpListener;\nuse tokio::time::{sleep, Duration};\n\nuse dexteri::ports::{parse_ports, common_ports, scan_host};\n\n// Test helper: Start a TCP server on a random port\nasync fn start_tcp_server() -\u003e (u16, tokio::task::JoinHandle\u003c()\u003e) {\n    let listener = TcpListener::bind(\"127.0.0.1:0\").await.unwrap();\n    let addr = listener.local_addr().unwrap();\n    let port = addr.port();\n    \n    let handle = tokio::spawn(async move {\n        loop {\n            if let Ok((socket, _)) = listener.accept().await {\n                // Accept and immediately close to simulate open port\n                let _ = socket;\n            }\n        }\n    });\n    \n    (port, handle)\n}\n\n#[test]\nfn test_parse_single_port() {\n    let result = parse_ports(\"80\").unwrap();\n    assert_eq!(result, vec![80]);\n}\n\n#[test]\nfn test_parse_multiple_ports() {\n    let result = parse_ports(\"80,443,8080\").unwrap();\n    assert_eq!(result, vec![80, 443, 8080]);\n}\n\n#[test]\nfn test_parse_port_range() {\n    let result = parse_ports(\"80-85\").unwrap();\n    assert_eq!(result, vec![80, 81, 82, 83, 84, 85]);\n}\n\n#[test]\nfn test_parse_mixed_format() {\n    let result = parse_ports(\"22,80-82,443\").unwrap();\n    assert_eq!(result, vec![22, 80, 81, 82, 443]);\n}\n\n#[test]\nfn test_parse_with_spaces() {\n    let result = parse_ports(\"22, 80 - 82 , 443\").unwrap();\n    assert_eq!(result, vec![22, 80, 81, 82, 443]);\n}\n\n#[test]\nfn test_parse_removes_duplicates() {\n    let result = parse_ports(\"80,443,80,443\").unwrap();\n    assert_eq!(result, vec![80, 443]);\n}\n\n#[test]\nfn test_parse_sorts_output() {\n    let result = parse_ports(\"443,22,80\").unwrap();\n    assert_eq!(result, vec![22, 80, 443]);\n}\n\n#[test]\nfn test_parse_complex_spec() {\n    let result = parse_ports(\"21-23,80,443,8000-8002,9000\").unwrap();\n    assert_eq!(result, vec![21, 22, 23, 80, 443, 8000, 8001, 8002, 9000]);\n}\n\n#[test]\nfn test_parse_empty_string() {\n    let result = parse_ports(\"\").unwrap();\n    assert_eq!(result, Vec::\u003cu16\u003e::new());\n}\n\n#[test]\nfn test_parse_whitespace_only() {\n    let result = parse_ports(\"  ,  ,  \").unwrap();\n    assert_eq!(result, Vec::\u003cu16\u003e::new());\n}\n\n#[test]\nfn test_parse_invalid_range() {\n    let result = parse_ports(\"100-50\");\n    assert!(result.is_err(), \"Should reject invalid range (start \u003e end)\");\n}\n\n#[test]\nfn test_parse_invalid_port_number() {\n    let result = parse_ports(\"70000\");\n    assert!(result.is_err(), \"Should reject port \u003e 65535\");\n}\n\n#[test]\nfn test_parse_non_numeric() {\n    let result = parse_ports(\"http\");\n    assert!(result.is_err(), \"Should reject non-numeric input\");\n}\n\n#[test]\nfn test_parse_large_range() {\n    let result = parse_ports(\"1-1024\").unwrap();\n    assert_eq!(result.len(), 1024);\n    assert_eq!(result[0], 1);\n    assert_eq!(result[1023], 1024);\n}\n\n#[test]\nfn test_common_ports_returns_sorted() {\n    let ports = common_ports();\n    assert!(ports.len() \u003e 30, \"Should have significant number of common ports\");\n    \n    // Verify sorted\n    for i in 1..ports.len() {\n        assert!(ports[i] \u003e ports[i - 1], \"Common ports should be sorted\");\n    }\n}\n\n#[test]\nfn test_common_ports_contains_standard_services() {\n    let ports = common_ports();\n    assert!(ports.contains(\u002622), \"Should include SSH\");\n    assert!(ports.contains(\u002680), \"Should include HTTP\");\n    assert!(ports.contains(\u0026443), \"Should include HTTPS\");\n    assert!(ports.contains(\u00263306), \"Should include MySQL\");\n    assert!(ports.contains(\u00265432), \"Should include PostgreSQL\");\n    assert!(ports.contains(\u002627017), \"Should include MongoDB\");\n}\n\n#[test]\nfn test_common_ports_no_duplicates() {\n    let ports = common_ports();\n    let unique_count = ports.iter().collect::\u003cstd::collections::HashSet\u003c_\u003e\u003e().len();\n    assert_eq!(ports.len(), unique_count, \"Common ports should have no duplicates\");\n}\n\n#[tokio::test]\nasync fn test_scan_single_open_port() {\n    let (port, _handle) = start_tcp_server().await;\n    \n    // Give server time to start\n    sleep(Duration::from_millis(50)).await;\n    \n    let result = scan_host(\"127.0.0.1\", \u0026vec![port], 10, 500, None).await.unwrap();\n    \n    assert_eq!(result.scanned, 1, \"Should scan 1 port\");\n    assert_eq!(result.open_ports.len(), 1, \"Should find 1 open port\");\n    assert_eq!(result.open_ports[0], port);\n}\n\n#[tokio::test]\nasync fn test_scan_closed_port() {\n    // Use a port that's very unlikely to be open (ephemeral range)\n    let closed_port = 54321u16;\n    \n    let result = scan_host(\"127.0.0.1\", \u0026vec![closed_port], 10, 100, None).await.unwrap();\n    \n    assert_eq!(result.scanned, 1, \"Should scan 1 port\");\n    // Note: There's a small chance this port is open, so we check it's likely closed\n    assert!(result.open_ports.len() \u003c= 1, \"Should find 0 or 1 port (if randomly open)\");\n}\n\n#[tokio::test]\nasync fn test_scan_multiple_ports() {\n    let (port1, _h1) = start_tcp_server().await;\n    let (port2, _h2) = start_tcp_server().await;\n    \n    sleep(Duration::from_millis(50)).await;\n    \n    let ports = vec![port1, port2, 19998]; // 2 open, 1 closed\n    let result = scan_host(\"127.0.0.1\", \u0026ports, 10, 500, None).await.unwrap();\n    \n    assert_eq!(result.scanned, 3, \"Should scan 3 ports\");\n    assert!(result.open_ports.len() \u003e= 2, \"Should find at least 2 open ports\");\n    assert!(result.open_ports.contains(\u0026port1));\n    assert!(result.open_ports.contains(\u0026port2));\n}\n\n#[tokio::test]\nasync fn test_scan_respects_concurrency() {\n    let (port, _handle) = start_tcp_server().await;\n    sleep(Duration::from_millis(50)).await;\n    \n    let ports = vec![port, 19997, 19996, 19995, 19994];\n    \n    // Low concurrency should still complete\n    let result = scan_host(\"127.0.0.1\", \u0026ports, 2, 500, None).await.unwrap();\n    \n    assert_eq!(result.scanned, 5, \"Should scan all ports even with low concurrency\");\n}\n\n#[tokio::test]\nasync fn test_scan_timeout_works() {\n    // Scan a port on a non-routable IP to trigger timeout\n    let result = scan_host(\"192.0.2.1\", \u0026vec![80], 10, 100, None).await.unwrap();\n    \n    assert_eq!(result.scanned, 1, \"Should attempt to scan 1 port\");\n    assert_eq!(result.open_ports.len(), 0, \"Should timeout and report closed\");\n}\n\n#[tokio::test]\nasync fn test_scan_returns_sorted_results() {\n    let (port1, _h1) = start_tcp_server().await;\n    let (port2, _h2) = start_tcp_server().await;\n    let (port3, _h3) = start_tcp_server().await;\n    \n    sleep(Duration::from_millis(50)).await;\n    \n    // Deliberately unsorted input\n    let ports = vec![port3, port1, port2];\n    let result = scan_host(\"127.0.0.1\", \u0026ports, 10, 500, None).await.unwrap();\n    \n    // Results should be sorted\n    for i in 1..result.open_ports.len() {\n        assert!(result.open_ports[i] \u003e result.open_ports[i - 1], \n                \"Results should be sorted\");\n    }\n}\n\n#[tokio::test]\nasync fn test_scan_with_cancel_flag() {\n    let (port1, _h1) = start_tcp_server().await;\n    let (port2, _h2) = start_tcp_server().await;\n    \n    sleep(Duration::from_millis(50)).await;\n    \n    let cancel = Arc::new(AtomicBool::new(false));\n    let cancel_clone = cancel.clone();\n    \n    // Immediately cancel\n    cancel.store(true, Ordering::Relaxed);\n    \n    let result = scan_host(\"127.0.0.1\", \u0026vec![port1, port2], 10, 500, Some(cancel_clone))\n        .await\n        .unwrap();\n    \n    // Should return early with no results\n    assert_eq!(result.scanned, 0, \"Should scan 0 ports when cancelled immediately\");\n    assert_eq!(result.open_ports.len(), 0, \"Should find 0 ports when cancelled\");\n}\n\n#[tokio::test]\nasync fn test_scan_with_delayed_cancel() {\n    let (port1, _h1) = start_tcp_server().await;\n    let (port2, _h2) = start_tcp_server().await;\n    let (port3, _h3) = start_tcp_server().await;\n    \n    sleep(Duration::from_millis(50)).await;\n    \n    let cancel = Arc::new(AtomicBool::new(false));\n    let cancel_clone = cancel.clone();\n    let cancel_trigger = cancel.clone();\n    \n    // Cancel after 50ms (earlier to ensure cancellation happens)\n    tokio::spawn(async move {\n        sleep(Duration::from_millis(50)).await;\n        cancel_trigger.store(true, Ordering::Relaxed);\n    });\n    \n    // Many ports with slow timeout to allow cancellation to trigger\n    let mut ports = vec![port1, port2, port3];\n    for i in 50000..50020 {\n        ports.push(i);\n    }\n    \n    let result = scan_host(\"127.0.0.1\", \u0026ports, 2, 1000, Some(cancel_clone))\n        .await\n        .unwrap();\n    \n    // With cancellation, should not scan all ports\n    // Due to timing, might scan some but not all\n    assert!(result.scanned \u003c= ports.len(), \"Scanned count should be \u003c= total ports\");\n}\n\n#[tokio::test]\nasync fn test_scan_invalid_hostname() {\n    let result = scan_host(\"invalid.invalid.invalid\", \u0026vec![80], 10, 500, None).await;\n    \n    // Should fail with DNS resolution error\n    assert!(result.is_err(), \"Should error on invalid hostname\");\n}\n\n#[tokio::test]\nasync fn test_scan_localhost_by_name() {\n    let (port, _handle) = start_tcp_server().await;\n    sleep(Duration::from_millis(50)).await;\n    \n    let result = scan_host(\"localhost\", \u0026vec![port], 10, 500, None).await.unwrap();\n    \n    assert_eq!(result.scanned, 1, \"Should resolve localhost\");\n    assert_eq!(result.open_ports.len(), 1, \"Should find open port on localhost\");\n}\n\n#[tokio::test]\nasync fn test_scan_empty_port_list() {\n    let result = scan_host(\"127.0.0.1\", \u0026vec![], 10, 500, None).await.unwrap();\n    \n    assert_eq!(result.scanned, 0, \"Should scan 0 ports\");\n    assert_eq!(result.open_ports.len(), 0, \"Should find 0 ports\");\n}\n\n#[tokio::test]\nasync fn test_scan_high_concurrency() {\n    let (port, _handle) = start_tcp_server().await;\n    sleep(Duration::from_millis(50)).await;\n    \n    let mut ports = vec![port];\n    // Add many closed ports\n    for i in 20000..20100 {\n        ports.push(i);\n    }\n    \n    // High concurrency should complete quickly\n    let start = std::time::Instant::now();\n    let result = scan_host(\"127.0.0.1\", \u0026ports, 100, 200, None).await.unwrap();\n    let elapsed = start.elapsed();\n    \n    assert_eq!(result.scanned, 101, \"Should scan all ports\");\n    assert!(elapsed.as_secs() \u003c 5, \"Should complete quickly with high concurrency\");\n}\n\n#[tokio::test]\nasync fn test_scan_ipv4_address() {\n    let (port, _handle) = start_tcp_server().await;\n    sleep(Duration::from_millis(50)).await;\n    \n    let result = scan_host(\"127.0.0.1\", \u0026vec![port], 10, 500, None).await.unwrap();\n    \n    assert_eq!(result.open_ports.len(), 1, \"Should work with IPv4 address\");\n}\n\n#[test]\nfn test_parse_port_range_boundary_values() {\n    // Test port 1\n    let result = parse_ports(\"1\").unwrap();\n    assert_eq!(result, vec![1]);\n    \n    // Test port 65535\n    let result = parse_ports(\"65535\").unwrap();\n    assert_eq!(result, vec![65535]);\n    \n    // Test range including boundary\n    let result = parse_ports(\"65533-65535\").unwrap();\n    assert_eq!(result, vec![65533, 65534, 65535]);\n}\n\n#[test]\nfn test_parse_port_zero_invalid() {\n    let result = parse_ports(\"0\");\n    // Port 0 is technically valid for binding but may not parse correctly\n    // This tests the actual behavior\n    if result.is_ok() {\n        assert_eq!(result.unwrap(), vec![0]);\n    }\n}\n\n#[tokio::test]\nasync fn test_scan_measures_scanned_count_accurately() {\n    let (port1, _h1) = start_tcp_server().await;\n    let (port2, _h2) = start_tcp_server().await;\n    \n    sleep(Duration::from_millis(50)).await;\n    \n    let ports = vec![port1, port2, 19989, 19988, 19987];\n    let result = scan_host(\"127.0.0.1\", \u0026ports, 10, 500, None).await.unwrap();\n    \n    assert_eq!(result.scanned, ports.len(), \"Scanned count should match input port count\");\n    assert!(result.open_ports.len() \u003e= 2, \"Should find at least the open ports\");\n    assert!(result.open_ports.len() \u003c= ports.len(), \"Cannot find more ports than scanned\");\n}\n","traces":[],"covered":0,"coverable":0},{"path":["/","home","lquessenberry","Custom Apps","dexteri","tests","report_generation.rs"],"content":"use tempfile::TempDir;\nuse url::Url;\n\nuse dexteri::report::write_report;\nuse dexteri::models::*;\n\nfn create_sample_crawl_result() -\u003e CrawlResult {\n    CrawlResult {\n        pages_crawled: 2,\n        links_checked: 5,\n        broken_links: vec![\n            LinkError {\n                url: \"https://example.com/broken\".to_string(),\n                status: Some(404),\n                reason: \"Not Found\".to_string(),\n                parent: \"https://example.com\".to_string(),\n                external: false,\n            }\n        ],\n        pages: vec![\n            Page {\n                url: \"https://example.com\".to_string(),\n                status: Some(200),\n                title: Some(\"Home Page\".to_string()),\n                links: vec![\"https://example.com/about\".to_string()],\n                content_type: Some(\"text/html\".to_string()),\n                bytes: Some(2048),\n                text: Some(\"Home page content\".to_string()),\n                signals: Some(MarketingSignals {\n                    json_ld_blocks: 1,\n                    json_ld_types: vec![],\n                    json_ld_raw: vec![],\n                    microdata_items: 2,\n                    microdata_types: vec![],\n                    open_graph_tags: 3,\n                    og_props: vec![],\n                    twitter_tags: 2,\n                    twitter_names: vec![],\n                    meta_robots: Some(\"index,follow\".to_string()),\n                    canonical_url: Some(\"https://example.com\".to_string()),\n                    hreflang_count: 0,\n                    hreflang_langs: vec![],\n                    trackers: vec![\"Google Analytics\".to_string()],\n                }),\n            },\n            Page {\n                url: \"https://example.com/about\".to_string(),\n                status: Some(200),\n                title: Some(\"About Us\".to_string()),\n                links: vec![],\n                content_type: Some(\"text/html\".to_string()),\n                bytes: Some(1024),\n                text: Some(\"About page content\".to_string()),\n                signals: None,\n            },\n        ],\n    }\n}\n\nfn create_sample_ports_result() -\u003e PortsResult {\n    PortsResult {\n        open_ports: vec![80, 443, 22],\n        scanned: 100,\n    }\n}\n\nfn create_sample_vuln_report() -\u003e VulnReport {\n    VulnReport {\n        findings: vec![\n            Finding {\n                title: \"Missing CSP\".to_string(),\n                description: \"Content Security Policy header not found\".to_string(),\n                severity: \"High\".to_string(),\n                url: Some(\"https://example.com\".to_string()),\n            },\n            Finding {\n                title: \"Missing HSTS\".to_string(),\n                description: \"HTTP Strict Transport Security not enabled\".to_string(),\n                severity: \"Medium\".to_string(),\n                url: Some(\"https://example.com\".to_string()),\n            },\n        ],\n    }\n}\n\nfn create_sample_security_flags() -\u003e Vec\u003cSecurityFlag\u003e {\n    vec![\n        SecurityFlag {\n            level: \"High\".to_string(),\n            title: \"Server version exposed\".to_string(),\n            description: \"Server header reveals nginx/1.18.0\".to_string(),\n            url: Some(\"https://example.com\".to_string()),\n        },\n        SecurityFlag {\n            level: \"Info\".to_string(),\n            title: \"CMS detected: WordPress\".to_string(),\n            description: \"WordPress 5.9 detected\".to_string(),\n            url: Some(\"https://example.com\".to_string()),\n        },\n    ]\n}\n\n#[test]\nfn test_write_report_creates_file() {\n    let temp_dir = TempDir::new().unwrap();\n    let report_path = temp_dir.path().join(\"report.html\");\n    \n    let url = Url::parse(\"https://example.com\").unwrap();\n    let crawl = create_sample_crawl_result();\n    let ports = create_sample_ports_result();\n    let vuln = create_sample_vuln_report();\n    let security = create_sample_security_flags();\n    \n    let result = write_report(\u0026report_path, \u0026url, \u0026crawl, \u0026ports, \u0026vuln, \u0026security);\n    \n    assert!(result.is_ok(), \"Report generation should succeed\");\n    assert!(report_path.exists(), \"Report file should be created\");\n}\n\n#[test]\nfn test_report_contains_html() {\n    let temp_dir = TempDir::new().unwrap();\n    let report_path = temp_dir.path().join(\"report.html\");\n    \n    let url = Url::parse(\"https://example.com\").unwrap();\n    let crawl = create_sample_crawl_result();\n    let ports = create_sample_ports_result();\n    let vuln = create_sample_vuln_report();\n    let security = create_sample_security_flags();\n    \n    write_report(\u0026report_path, \u0026url, \u0026crawl, \u0026ports, \u0026vuln, \u0026security).unwrap();\n    \n    let content = std::fs::read_to_string(\u0026report_path).unwrap();\n    assert!(content.contains(\"\u003c!DOCTYPE html\u003e\") || content.contains(\"\u003chtml\"));\n    assert!(content.contains(\"\u003c/html\u003e\"));\n}\n\n#[test]\nfn test_report_contains_target_url() {\n    let temp_dir = TempDir::new().unwrap();\n    let report_path = temp_dir.path().join(\"report.html\");\n    \n    let url = Url::parse(\"https://example.com\").unwrap();\n    let crawl = create_sample_crawl_result();\n    let ports = create_sample_ports_result();\n    let vuln = create_sample_vuln_report();\n    let security = create_sample_security_flags();\n    \n    write_report(\u0026report_path, \u0026url, \u0026crawl, \u0026ports, \u0026vuln, \u0026security).unwrap();\n    \n    let content = std::fs::read_to_string(\u0026report_path).unwrap();\n    assert!(content.contains(\"example.com\"), \"Report should contain target URL\");\n}\n\n#[test]\nfn test_report_with_empty_results() {\n    let temp_dir = TempDir::new().unwrap();\n    let report_path = temp_dir.path().join(\"report.html\");\n    \n    let url = Url::parse(\"https://example.com\").unwrap();\n    let crawl = CrawlResult {\n        pages_crawled: 0,\n        links_checked: 0,\n        broken_links: vec![],\n        pages: vec![],\n    };\n    let ports = PortsResult { open_ports: vec![], scanned: 0 };\n    let vuln = VulnReport { findings: vec![] };\n    let security = vec![];\n    \n    let result = write_report(\u0026report_path, \u0026url, \u0026crawl, \u0026ports, \u0026vuln, \u0026security);\n    \n    assert!(result.is_ok(), \"Should handle empty results\");\n    assert!(report_path.exists(), \"Should create report even with empty data\");\n}\n\n#[test]\nfn test_report_file_size_reasonable() {\n    let temp_dir = TempDir::new().unwrap();\n    let report_path = temp_dir.path().join(\"report.html\");\n    \n    let url = Url::parse(\"https://example.com\").unwrap();\n    let crawl = create_sample_crawl_result();\n    let ports = create_sample_ports_result();\n    let vuln = create_sample_vuln_report();\n    let security = create_sample_security_flags();\n    \n    write_report(\u0026report_path, \u0026url, \u0026crawl, \u0026ports, \u0026vuln, \u0026security).unwrap();\n    \n    let metadata = std::fs::metadata(\u0026report_path).unwrap();\n    assert!(metadata.len() \u003e 1000, \"Report should be at least 1KB\");\n    assert!(metadata.len() \u003c 10_000_000, \"Report should be less than 10MB\");\n}\n","traces":[],"covered":0,"coverable":0},{"path":["/","home","lquessenberry","Custom Apps","dexteri","tests","security_authenticity.rs"],"content":"use std::{net::SocketAddr};\n\nuse axum::{\n    routing::{get, head},\n    Router,\n    http::{HeaderMap, HeaderValue, StatusCode, header},\n    response::IntoResponse,\n};\nuse tokio::net::TcpListener;\nuse url::Url;\n\n// Import the real scanner entry point we want to validate\nuse dexteri::security::check_security_posture;\n\nasync fn start_fixture_server() -\u003e (SocketAddr, tokio::task::JoinHandle\u003c()\u003e) {\n    // Build routes\n    let app = Router::new()\n        // Main page with meta generator to simulate WordPress 5.9\n        .route(\n            \"/\",\n            get(|| async move {\n                let mut headers = HeaderMap::new();\n                headers.insert(header::SERVER, HeaderValue::from_str(\"nginx/1.18\").unwrap());\n                headers.insert(header::HeaderName::from_static(\"x-powered-by\"), HeaderValue::from_str(\"Express 4.17\").unwrap());\n                // Intentionally omit CSP, XFO, X-Content-Type-Options, Referrer-Policy\n                let body = r#\"\u003c!doctype html\u003e\n\u003chtml\u003e\u003chead\u003e\n  \u003cmeta name=generator content=\"WordPress 5.9\" /\u003e\n\u003c/head\u003e\u003cbody\u003e\n  \u003ch1\u003eFixture Site\u003c/h1\u003e\n  \u003cp\u003ewp-content/themes/twentytwenty\u003c/p\u003e\n\u003c/body\u003e\u003c/html\u003e\"#;\n                (StatusCode::OK, headers, body).into_response()\n            })\n            .head(|| async move {\n                let mut headers = HeaderMap::new();\n                headers.insert(header::SERVER, HeaderValue::from_str(\"nginx/1.18\").unwrap());\n                headers.insert(header::HeaderName::from_static(\"x-powered-by\"), HeaderValue::from_str(\"Express 4.17\").unwrap());\n                (StatusCode::OK, headers).into_response()\n            }),\n        )\n        // Sensitive file exposed\n        .route(\n            \"/.env\",\n            get(|| async move {\n                let mut headers = HeaderMap::new();\n                headers.insert(header::SERVER, HeaderValue::from_str(\"nginx/1.18\").unwrap());\n                let body = \"SECRET_KEY=abc123\";\n                (StatusCode::OK, headers, body).into_response()\n            })\n            .head(|| async move { (StatusCode::OK).into_response() }),\n        );\n\n    // Bind random port\n    let listener = TcpListener::bind((\"127.0.0.1\", 0)).await.unwrap();\n    let addr = listener.local_addr().unwrap();\n    let handle = tokio::spawn(async move {\n        axum::serve(listener, app).await.unwrap();\n    });\n    (addr, handle)\n}\n\n#[tokio::test]\nasync fn detects_expected_security_flags() {\n    let (addr, _handle) = start_fixture_server().await;\n    let url = Url::parse(\u0026format!(\"http://{}/\", addr)).unwrap();\n\n    let client = reqwest::Client::builder()\n        .redirect(reqwest::redirect::Policy::limited(10))\n        .build()\n        .unwrap();\n\n    let flags = check_security_posture(\u0026client, \u0026url).await.expect(\"scan ok\");\n    let titles: Vec\u003cString\u003e = flags.iter().map(|f| f.title.clone()).collect();\n\n    // Headers missing (HTTP, so HSTS is not required)\n    assert!(titles.contains(\u0026\"Missing CSP\".to_string()));\n    assert!(titles.contains(\u0026\"Missing X-Frame-Options\".to_string()));\n    assert!(titles.contains(\u0026\"Missing X-Content-Type-Options\".to_string()));\n    assert!(titles.contains(\u0026\"Missing Referrer-Policy\".to_string()));\n\n    // Server/X-Powered-By version exposure\n    assert!(titles.contains(\u0026\"Server header exposes version\".to_string()));\n    assert!(titles.contains(\u0026\"X-Powered-By exposes version\".to_string()));\n\n    // CMS detection and version flags based on meta generator\n    assert!(titles.iter().any(|t| t.contains(\"CMS detected: WordPress\")));\n    assert!(titles.iter().any(|t| t.c   let (addr, _handle) = start_drupal_changelog_fixture().await;\n    let url = Url::parse(\u0026format!(\"http://{}/\", addr)).unwrap();\n    let client = reqwest::Client::builder().build().unwrap();\n    let flags = check_security_posture(\u0026client, \u0026url).await.expect(\"scan ok\");\n    let titles: Vec\u003cString\u003e = flags.iter().map(|f| f.title.clone()).collect();\n    assert!(titles.contains(\u0026\"Drupal changelog exposed\".to_string()));\n}\n\nasync fn start_nosniff_fixture() -\u003e (SocketAddr, tokio::task::JoinHandle\u003c()\u003e) {\n    let app = Router::new().route(\n        \"/\",\n        get(|| async move {\n            let mut headers = HeaderMap::new();\n            headers.insert(header::HeaderName::from_static(\"x-content-type-options\"), HeaderValue::from_static(\"nosniff\"));\n            (StatusCode::OK, headers, \"ok\").into_response()\n        })\n        .head(|| async move {\n            let mut headers = HeaderMap::new();\n            headers.insert(header::HeaderName::from_static(\"x-content-type-options\"), HeaderValue::from_static(\"nosniff\"));\n            (StatusCode::OK, headers).into_response()\n        }),\n    );\n    serve(app).await\n}\n\n#[tokio::test]\nasync fn x_content_type_options_nosniff_not_flagged() {\n    let (addr, _handle) = start_nosniff_fixture().await;\n    let url = Url::parse(\u0026format!(\"http://{}/\", addr)).unwrap();\n    let client = reqwest::Client::builder().build().unwrap();\n    let flags = check_security_posture(\u0026client, \u0026url).await.expect(\"scan ok\");\n    let titles: Vec\u003cString\u003e = flags.iter().map(|f| f.title.clone()).collect();\n    assert!(titles.iter().all(|t| t != \"Missing X-Content-Type-Options\"));\n}\n","traces":[],"covered":0,"coverable":0},{"path":["/","home","lquessenberry","Custom Apps","dexteri","tests","security_authenticity_tls.rs"],"content":"use std::{net::SocketAddr};\n\nuse axum::{\n    routing::get,\n    Router,\n    http::{HeaderMap, HeaderValue, StatusCode, header},\n    response::IntoResponse,\n};\nuse axum_server::tls_rustls::RustlsConfig;\nuse tokio::net::TcpListener;\nuse url::Url;\n\nuse dexteri::security::check_security_posture;\n\nasync fn self_signed_config() -\u003e RustlsConfig {\n    let cert = rcgen::generate_simple_self_signed([\"localhost\".to_string()]).unwrap();\n    let cert_pem = cert.cert.pem();\n    let key_pem = cert.key_pair.serialize_pem();\n    RustlsConfig::from_pem(cert_pem.into(), key_pem.into()).await.unwrap()\n}\n\nasync fn serve_tls(app: Router) -\u003e (SocketAddr, tokio::task::JoinHandle\u003c()\u003e) {\n    let listener = TcpListener::bind((\"127.0.0.1\", 0)).await.unwrap();\n    let addr = listener.local_addr().unwrap();\n    let config = self_signed_config().await;\n    let handle = tokio::spawn(async move {\n        axum_server::from_tcp_rustls(listener.into_std().unwrap(), config)\n            .serve(app.into_make_service())\n            .await\n            .unwrap();\n    });\n    (addr, handle)\n}\n\nasync fn start_https_without_hsts() -\u003e (SocketAddr, tokio::task::JoinHandle\u003c()\u003e) {\n    let app = Router::new().route(\n        \"/\",\n        get(|| async move {\n            // No HSTS\n            let headers = HeaderMap::new();\n            (StatusCode::OK, headers, \"ok\").into_response()\n        }),\n    );\n    serve_tls(app).await\n}\n\nasync fn start_https_with_hsts() -\u003e (SocketAddr, tokio::task::JoinHandle\u003c()\u003e) {\n    let app = Router::new().route(\n        \"/\",\n        get(|| async move {\n            let mut headers = HeaderMap::new();\n            headers.insert(header::HeaderName::from_static(\"strict-transport-security\"), HeaderValue::from_static(\"max-age=31536000; includeSubDomains\"));\n            (StatusCode::OK, headers, \"ok\").into_response()\n        }),\n    );\n    serve_tls(app).await\n}\n\n#[tokio::test]\nasync fn https_missing_hsts_is_flagged() {\n    let (addr, _h) = start_https_without_hsts().await;\n nwrap();\n    let host = host_from_url(\u0026url);\n    assert_eq!(host, Some(\"localhost\".to_string()));\n}\n\n#[test]\nfn test_host_from_url_ip_address() {\n    let url = Url::parse(\"http://192.168.1.1/path\").unwrap();\n    let host = host_from_url(\u0026url);\n    assert_eq!(host, Some(\"192.168.1.1\".to_string()));\n}\n\n#[test]\nfn test_sanitize_url_removes_fragment() {\n    let url = Url::parse(\"https://example.com/path#fragment\").unwrap();\n    let normalized = sanitize_url(\u0026url);\n    assert!(!normalized.as_str().contains(\"#fragment\"));\n}\n\n#[test]\nfn test_sanitize_url_preserves_query() {\n    let url = Url::parse(\"https://example.com/path?key=value\").unwrap();\n    let normalized = sanitize_url(\u0026url);\n    assert!(normalized.as_str().contains(\"key=value\"));\n}\n\n#[test]\nfn test_sanitize_url_trailing_slash() {\n    let url = Url::parse(\"https://example.com/path/\").unwrap();\n    let normalized = sanitize_url(\u0026url);\n    // Normalization behavior depends on implementation\n    assert!(normalized.as_str().starts_with(\"https://example.com\"));\n}\n\n#[test]\nfn test_is_same_origin_identical_urls() {\n    let url1 = Url::parse(\"https://example.com/page1\").unwrap();\n    let url2 = Url::parse(\"https://example.com/page2\").unwrap();\n    assert!(is_same_origin(\u0026url1, \u0026url2));\n}\n\n#[test]\nfn test_is_same_origin_different_schemes() {\n    let url1 = Url::parse(\"http://example.com/page\").unwrap();\n    let url2 = Url::parse(\"https://example.com/page\").unwrap();\n    assert!(!is_same_origin(\u0026url1, \u0026url2));\n}\n\n#[test]\nfn test_is_same_origin_different_hosts() {\n    let url1 = Url::parse(\"https://example.com/page\").unwrap();\n    let url2 = Url::parse(\"https://other.com/page\").unwrap();\n    assert!(!is_same_origin(\u0026url1, \u0026url2));\n}\n\n#[test]\nfn test_is_same_origin_different_ports() {\n    let url1 = Url::parse(\"https://example.com:443/page\").unwrap();\n    let url2 = Url::parse(\"htt u003c/h1\u003e\u003c/body\u003e\u003c/html\u003e\";\n            (StatusCode::OK, headers, html).into_response()\n        }),\n    );\n    let (addr, _handle) = serve(app).await;\n    let url = Url::parse(\u0026format!(\"http://{}/\", addr)).unwrap();\n    let client = reqwest::Client::new();\n    \n    let result = scan(\u0026client, \u0026url).await.unwrap();\n    \n    // Should detect multiple issues\n    assert!(result.findings.len() \u003e= 5, \"Should find multiple vulnerabilities\");\n    \n    let titles: Vec\u003cString\u003e = result.findings.iter().map(|f| f.title.clone()).collect();\n    assert!(titles.contains(\u0026\"Site not using HTTPS\".to_string()));\n    assert!(titles.contains(\u0026\"Missing CSP\".to_string()));\n    assert!(titles.contains(\u0026\"Server header leaks software\".to_string()));\n    assert!(titles.contains(\u0026\"Possible directory listing\".to_string()));\n}\n\n#[tokio::test]\nasync fn test_secure_site_minimal_findings() {\n    use axum_server::tls_rustls::RustlsConfig;\n    \n    async fn self_signed_config() -\u003e RustlsConfig {\n        let cert = rcgen::generate_simple_self_signed([\"localhost\".to_string()]).unwrap();\n        let cert_pem = cert.cert.pem();\n        let key_pem = cert.key_pair.serialize_pem();\n        RustlsConfig::from_pem(cert_pem.into(), key_pem.into()).await.unwrap()\n    }\n    \n    let app = Router::new().route(\n        \"/\",\n        get(|| async move {\n            let mut headers = HeaderMap::new();\n            headers.insert(\n                header::HeaderName::from_static(\"strict-transport-security\"),\n                HeaderValue::from_static(\"max-age=31536000\"),\n            );\n            headers.insert(\n                header::HeaderName::from_static(\"content-security-policy\"),\n                HeaderValue::from_static(\"default-src 'self'\"),\n            );\n            headers.insert(\n                header::HeaderName::from_static(\"x-frame-options\"),\n ;\n    let (addr, _handle) = serve(app).await;\n    let url = Url::parse(\u0026format!(\"http://{}/\", addr)).unwrap();\n    let client = reqwest::Client::new();\n    \n    let result = scan(\u0026client, \u0026url).await.unwrap();\n    \n    // Check that findings have severity levels\n    for finding in \u0026result.findings {\n        assert!(\n            [\"Low\", \"Medium\", \"High\", \"Info\"].contains(\u0026finding.severity.as_str()),\n            \"Severity should be valid: {}\",\n            finding.severity\n        );\n    }\n}\n\n#[tokio::test]\nasync fn test_findings_have_urls() {\n    let app = Router::new().route(\n        \"/\",\n        get(|| async move {\n            (StatusCode::OK, \"ok\").into_response()\n        }),\n    );\n    let (addr, _handle) = serve(app).await;\n    let url = Url::parse(\u0026format!(\"http://{}/\", addr)).unwrap();\n    let client = reqwest::Client::new();\n    \n    let result = scan(\u0026client, \u0026url).await.unwrap();\n    \n    // Most findings should have associated URLs\n    let with_urls = result.findings.iter().filter(|f| f.url.is_some()).count();\n    assert!(with_urls \u003e 0, \"At least some findings should have URLs\");\n}\n","traces":[],"covered":0,"coverable":0},{"path":["/","home","lquessenberry","Custom Apps","dexteri","tests","web_api_smoke.rs"],"content":"// Lightweight smoke tests for Web API\n// These tests verify the API server can start and respond to basic requests\n// Full integration tests would require more complex setup\n\nuse std::net::SocketAddr;\nuse tokio::time::{sleep, Duration, timeout};\nuse tokio::net::TcpListener;\n\n// Test that the web server module is accessible and has required exports\n#[test]\nfn test_web_module_exists() {\n    // This ensures web module compiles and the serve function exists\n    // We can't call it here (needs async runtime), but we can reference it\n    let _ = dexteri::web::serve;\n}\n\n// Helper to check if a port is available\nasync fn find_available_port() -\u003e Option\u003cu16\u003e {\n    for port in 30000..40000 {\n        if TcpListener::bind(format!(\"127.0.0.1:{}\", port)).await.is_ok() {\n            return Some(port);\n        }\n    }\n    None\n}\n\n#[tokio::test]\nasync fn test_web_server_can_start() {\n    let port = find_available_port().await.expect(\"No ports available\");\n    let addr: SocketAddr = format!(\"127.0.0.1:{}\", port).parse().unwrap();\n    \n    let server_handle = tokio::spawn(async move {\n        // Server will try to start; we'll abort it quickly\n        let _ = dexteri::web::serve(addr).await;\n    });\n    \n    // Give it a moment to attempt startup\n    sleep(Duration::from_millis(300)).await;\n    \n    // Check if we can connect\n    let client = reqwest::Client::builder()\n        .timeout(Duration::from_secs(2))\n        .build()\n        .unwrap();\n    \n    let result = timeout(\n        Duration::from_secs(3),\n        client.get(format!(\"http://127.0.0.1:{}/\", port)).send()\n    ).await;\n    \n    // Cleanup\n    server_handle.abort();\n    \n    // If we got any response (even error), server started\n    assert!(result.is_ok() || result.is_err(), \"Server should attempt to start\");\n}\n\n#[tokio::test(flavor = \"multi_thread\", worker_threads = 2)]\nasync fn test_api_endpoints_structure() {\n    // This test verifies that the endpoint handlers exist and compile\n    // by checking the web module structure\n    \n    let port = find_available_port().await.expect(\"No ports available\");\n    let addr: SocketAddr = format!(\"127.0.0.1:{}\", port).parse().unwrap();\n    \n    let handle = tokio::spawn(async move {\n        let _ = dexteri::web::serve(addr).await;\n    });\n    \n    sleep(Duration::from_millis(500)).await;\n    \n    let client = reqwest::Client::builder()\n        .timeout(Duration::from_secs(2))\n        .build()\n        .unwrap();\n    \n    // Try to hit the index endpoint\n    let index_result = timeout(\n        Duration::from_secs(2),\n        client.get(format!(\"http://127.0.0.1:{}/\", port)).send()\n    ).await;\n    \n    handle.abort();\n    \n    // We expect either success or connection errors, but not a timeout\n    match index_result {\n        Ok(Ok(response)) =\u003e {\n            // Server responded\n            assert!(response.status().is_success() || response.status().is_client_error());\n        },\n        Ok(Err(e)) =\u003e {\n            // Connection error is acceptable (server may not have fully started)\n            assert!(e.is_connect() || e.is_timeout(), \"Expected connection or timeout error\");\n        },\n        Err(_) =\u003e {\n            // Timeout - acceptable in test environment\n        }\n    }\n}\n\n#[tokio::test]\nasync fn test_concurrent_server_instances_conflict() {\n    let port = find_available_port().await.expect(\"No ports available\");\n    let addr: SocketAddr = format!(\"127.0.0.1:{}\", port).parse().unwrap();\n    \n    // Start first server\n    let handle1 = tokio::spawn(async move {\n        dexteri::web::serve(addr).await\n    });\n    \n    sleep(Duration::from_millis(200)).await;\n    \n    // Try to start second server on same port (should fail)\n    let handle2 = tokio::spawn(async move {\n        dexteri::web::serve(addr).await\n    });\n    \n    sleep(Duration::from_millis(200)).await;\n    \n    // Cleanup\n    handle1.abort();\n    handle2.abort();\n    \n    // Second server should have failed to bind\n    // This test mainly ensures the server binding logic works correctly\n}\n\n#[test]\nfn test_run_params_structure() {\n    // Verify RunAllParams can be serialized/deserialized\n    let json = serde_json::json!({\n        \"url\": \"https://example.com\",\n        \"depth\": 2,\n        \"concurrency\": 32,\n        \"externals\": true,\n        \"include_subdomains\": false,\n        \"ports\": \"80,443\",\n        \"port_concurrency\": 512,\n        \"timeout_ms\": 800,\n        \"rate_limit_rps\": 10\n    });\n    \n    // This compiles and runs if the web API structs are properly defined\n    assert!(json.is_object());\n    assert_eq!(json[\"url\"], \"https://example.com\");\n}\n\n#[test]\nfn test_export_format_parameters() {\n    // Test that export format query parameters would be valid\n    let formats = vec![\"json\", \"html\", \"xml\", \"csv\"];\n    \n    for format in formats {\n        let query = format!(\"format={}\", format);\n        assert!(query.contains(\"format=\"));\n    }\n}\n\n#[test]\nfn test_csv_kinds() {\n    // Verify CSV export kinds are defined\n    let kinds = vec![\"pages\", \"broken_links\", \"ports\", \"findings\", \"security\"];\n    \n    for kind in kinds {\n        assert!(!kind.is_empty());\n    }\n}\n\n#[tokio::test]\nasync fn test_status_endpoint_accessible() {\n    let port = find_available_port().await.expect(\"No ports available\");\n    let addr: SocketAddr = format!(\"127.0.0.1:{}\", port).parse().unwrap();\n    \n    let handle = tokio::spawn(async move {\n        let _ = dexteri::web::serve(addr).await;\n    });\n    \n    sleep(Duration::from_millis(400)).await;\n    \n    let client = reqwest::Client::builder()\n        .timeout(Duration::from_secs(2))\n        .build()\n        .unwrap();\n    \n    // Try status endpoint\n    let result = timeout(\n        Duration::from_secs(2),\n        client.get(format!(\"http://127.0.0.1:{}/api/status\", port)).send()\n    ).await;\n    \n    handle.abort();\n    \n    // Accept any result - this test verifies routing exists\n    match result {\n        Ok(Ok(response)) =\u003e {\n            // Got a response - good!\n            assert!(response.status().as_u16() \u003c 600);\n        },\n        Ok(Err(_)) | Err(_) =\u003e {\n            // Connection errors acceptable in test env\n        }\n    }\n}\n\n#[test]\nfn test_models_are_serializable() {\n    // Verify that CombinedResult structure can be created\n    use dexteri::models::*;\n    \n    let crawl = CrawlResult {\n        pages_crawled: 0,\n        links_checked: 0,\n        broken_links: vec![],\n        pages: vec![],\n    };\n    \n    let ports = PortsResult {\n        open_ports: vec![],\n        scanned: 0,\n    };\n    \n    let vuln = VulnReport {\n        findings: vec![],\n    };\n    \n    let security: Vec\u003cSecurityFlag\u003e = vec![];\n    \n    // These structures should be compatible with web API\n    assert_eq!(crawl.pages_crawled, 0);\n    assert_eq!(ports.scanned, 0);\n    assert_eq!(vuln.findings.len(), 0);\n    assert_eq!(security.len(), 0);\n}\n","traces":[],"covered":0,"coverable":0}]};

((start.clone(), 0));\n    visited.insert(start.as_str().to_string());\n\n    let mut pages: Vec\u003cPage\u003e = Vec::new();\n    let mut links_checked: usize = 0;\n    let mut broken: Vec\u003cLinkError\u003e = Vec::new();\n\n    let mut in_flight: FuturesUnordered\u003c_\u003e = FuturesUnordered::new();\n    let mut limiter: Option\u003cInterval\u003e = rate_limit_rps.map(|rps| {\n        let rps = if rps == 0 { 1 } else { rps };\n        let ms = std::cmp::max(1u32, 1000 / rps);\n        tokio::time::interval(Duration::from_millis(ms as u64))\n    });\n    // Heartbeat to indicate progress periodically even if no pages complete\n    let mut heartbeat = tokio::time::interval(Duration::from_secs(2));\n\n    if let Some(tx) = \u0026log {\n        let _ = tx.send(format!(\n            \"crawl start url={} depth={} concurrency={} externals={} include_subdomains={}\",\n            start, max_depth, concurrency, check_externals, include_subdomains\n        ));\n    }\n    let mut last_emit = std::time::Instant::now();\n    let mut emit = |force: bool,\n                    in_flight_len: usize,\n                    queue_len: usize,\n                    pages_len: usize,\n                    links: usize,\n                    broken_len: usize| {\n        if let Some(p) = \u0026progress {\n            let now = std::time::Instant::now();\n            if force || now.duration_since(last_emit).as_millis() \u003e= 200 {\n                let _ = p.send(CrawlProgress {\n                    pages_crawled: pages_len,\n                    links_checked: links,\n                    queue_size: queue_len,\n                    in_flight: in_flight_len,\n                    broken_links: broken_len,\n                });\n                last_emit = now;\n            }\n        }\n    };\n\n    while !q.is_empty() || !in_flight.is_empty() {\n        let cancelled = cancel_flag\n            .as_ref()\n            .map(|c| c.load(Ordering::Relaxed))\n            .unwrap_or(false);\n        if cancelled {\n            if let Some(tx) = \u0026log {\n                let _ = tx.send(\"cancel requested; clearing queue\".to_string());\n            }\n            q.clear();\n        }\n        while in_flight.len() \u003c concurrency {\n            if let Some((url, depth)) = q.pop_front() {\n                if let Some(tx) = \u0026log {\n                    let _ = tx.send(format!(\"dequeue depth={} url={}\", depth, url));\n                }\n                let client_cl = client.clone();\n                let log_cl = log.clone();\n                if cancelled {\n                    break;\n                }\n                if let Some(l) = \u0026mut limiter {\n                    l.tick().await;\n                }\n                in_flight.push(async move {\n                    let (page, new_links, errs) = fetch_and_parse(\n                        \u0026client_cl,\n                        \u0026url,\n                        MAX_BODY_PREVIEW,\n                        log_cl.clone(),\n                        check_externals,\n                    )\n                    .await\n                    .unwrap_or_else(|_| {\n                        (\n                            Page {\n                                url: url.as_str().to_string(),\n                                status: None,\n                                title: None,\n                                links: vec![],\n                                content_type: None,\n                                bytes: None,\n                                text: None,\n                                signals: None,\n                            },\n                            vec![],\n                            vec![LinkError {\n                                url: url.as_str().to_string(),\n                                status: None,\n                                reason: \"request error\".into(),\n                                parent: url.as_str().to_string(),\n hild(even){background:#fafafa} .sev-Info{color:#555}.sev-Low{color:#2a7}.sev-Medium{color:#d88400}.sev-High{color:#d33}.sev-Critical{color:#a00;font-weight:bold}\");\n    html.push_str(\".summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:1rem;margin:1rem 0} .card{border:1px solid #ddd;border-radius:8px;padding:1rem;background:#fff}\");\n    html.push_str(\"\u003c/style\u003e\u003c/head\u003e\u003cbody\u003e\");\n\n    html.push_str(\u0026format!(\n        \"\u003ch1\u003eDexteri++ Report\u003c/h1\u003e\u003cp\u003eTarget: \u003ca href=\\\"{}\\\"\u003e{}\u003c/a\u003e\u003c/p\u003e\",\n        start, start\n    ));\n\n    html.push_str(\"\u003csection class=\\\"summary\\\"\u003e\");\n    html.push_str(\u0026format!(\n        \"\u003cdiv class=\\\"card\\\"\u003e\u003cb\u003ePages crawled\u003c/b\u003e\u003cdiv style=\\\"font-size:1.4rem\\\"\u003e{}\u003c/div\u003e\u003c/div\u003e\",\n        crawl.pages_crawled\n    ));\n    html.push_str(\u0026format!(\n        \"\u003cdiv class=\\\"card\\\"\u003e\u003cb\u003eLinks checked\u003c/b\u003e\u003cdiv style=\\\"font-size:1.4rem\\\"\u003e{}\u003c/div\u003e\u003c/div\u003e\",\n        crawl.links_checked\n    ));\n    html.push_str(\u0026format!(\n        \"\u003cdiv class=\\\"card\\\"\u003e\u003cb\u003eBroken links\u003c/b\u003e\u003cdiv style=\\\"font-size:1.4rem\\\"\u003e{}\u003c/div\u003e\u003c/div\u003e\",\n        crawl.broken_links.len()\n    ));\n    html.push_str(\u0026format!(\n        \"\u003cdiv class=\\\"card\\\"\u003e\u003cb\u003eOpen ports\u003c/b\u003e\u003cdiv style=\\\"font-size:1.4rem\\\"\u003e{}\u003c/div\u003e\u003c/div\u003e\",\n        ports.open_ports.len()\n    ));\n    html.push_str(\u0026format!(\n        \"\u003cdiv class=\\\"card\\\"\u003e\u003cb\u003eVuln findings\u003c/b\u003e\u003cdiv style=\\\"font-size:1.4rem\\\"\u003e{}\u003c/div\u003e\u003c/div\u003e\",\n        vuln.findings.len()\n    ));\n    html.push_str(\"\u003c/section\u003e\");\n\n    // Marketing / Structured Data Signals (summary)\n    let mut json_ld_total = 0usize;\n    let mut microdata_total = 0usize;\n    let mut og_total = 0usize;\n    let mut tw_total = 0usize;\n    let mut robots_pages = 0usize;\n    let mut canonical_pages = 0usize;\n    let mut hreflang_total = 0usize;\n    let mut tracker_counts: HashMap\u003cString, usize\u003e = HashMap::new();\n    for p in \u0026crawl.pages {\n        if let Some(s) = \u0026p.signals {\n            json_ld_total += s.json_ld_blocks;\n            microdata_total += s.microdata_items;\n            og_total += s.open_graph_tags;\n            tw_total += s.twitter_tags;\n            if s.meta_robots.as_deref().unwrap_or(\"\").len() \u003e 0 {\n                robots_pages += 1;\n            }\n            if s.canonical_url.as_deref().unwrap_or(\"\").len() \u003e 0 {\n                canonical_pages += 1;\n            }\n            hreflang_total += s.hreflang_count;\n            for t in \u0026s.trackers {\n                *tracker_counts.entry(t.clone()).or_insert(0) += 1;\n            }\n        }\n    }\n    if !crawl.pages.is_empty() {\n        html.push_str(\"\u003ch2\u003eMarketing \u0026 Structured Data\u003c/h2\u003e\");\n        html.push_str(\"\u003cdiv class=\\\"summary\\\"\u003e\");\n        html.push_str(\u0026format!(\"\u003cdiv class=\\\"card\\\"\u003e\u003cb\u003eJSON-LD blocks\u003c/b\u003e\u003cdiv style=\\\"font-size:1.4rem\\\"\u003e{}\u003c/div\u003e\u003c/div\u003e\", json_ld_total));\n        html.push_str(\u0026format!(\"\u003cdiv class=\\\"card\\\"\u003e\u003cb\u003eMicrodata items\u003c/b\u003e\u003cdiv style=\\\"font-size:1.4rem\\\"\u003e{}\u003c/div\u003e\u003c/div\u003e\", microdata_total));\n        html.push_str(\u0026format!(\"\u003cdiv class=\\\"card\\\"\u003e\u003cb\u003eOpenGraph tags\u003c/b\u003e\u003cdiv style=\\\"font-size:1.4rem\\\"\u003e{}\u003c/div\u003e\u003c/div\u003e\", og_total));\n        html.push_str(\u0026format!(\n            \"\u003cdiv class=\\\"card\\\"\u003e\u e=generator]\").unwrap();\n        doc.select(\u0026sel_meta_gen)\n            .filter_map(|m| m.value().attr(\"content\").map(|s| s.to_string()))\n            .collect()\n    };\n\n    let lc = text.to_lowercase();\n\n    // Helper: add flag\n    let mut add = |lvl: \u0026str, title: \u0026str, desc: String, url: Option\u003cString\u003e| {\n        flags.push(SecurityFlag {\n            level: lvl.into(),\n            title: title.into(),\n            description: desc,\n            url,\n        });\n    };\n\n    // 3) Security headers presence (Medium if missing)\n    let is_https = base.scheme() == \"https\";\n    let get_hdr = |name: \u0026str| {\n        headers\n            .get(name)\n            .and_then(|v| v.to_str().ok())\n            .unwrap_or(\"\")\n            .to_string()\n    };\n    let hsts = get_hdr(\"strict-transport-security\");\n    if is_https \u0026\u0026 hsts.is_empty() {\n        add(\n            \"Medium\",\n            \"Missing HSTS\",\n            \"Strict-Transport-Security header is not present\".into(),\n            None,\n        );\n    }\n    if get_hdr(\"content-security-policy\").is_empty() {\n        add(\n            \"Medium\",\n            \"Missing CSP\",\n            \"Content-Security-Policy header is not present\".into(),\n            None,\n        );\n    }\n    if get_hdr(\"x-frame-options\").is_empty() {\n        add(\n            \"Medium\",\n            \"Missing X-Frame-Options\",\n            \"Clickjacking protection header is not present\".into(),\n            None,\n        );\n    }\n    if get_hdr(\"x-content-type-options\").to_ascii_lowercase() != \"nosniff\" {\n        add(\n            \"Medium\",\n            \"Missing X-Content-Type-Options\",\n            \"X-Content-Type-Options is not 'nosniff'\".into(),\n            None,\n        );\n    }\n    if get_hdr(\"referrer-policy\").is_empty() {\n        add(\n            \"Medium\",\n            \"Missing Referrer-Policy\",\n            \"Referrer-Policy header is not present\".into(),\n            None,\n        );\n    }\n\n    // 4) Server exposure via headers\n    if let Some(sv) = headers.get(SERVER).and_then(|v| v.to_str().ok()) {\n        if sv.trim().len() \u003e 0 {\n            // With version -\u003e Medium, otherwise Low\n            let has_ver = sv.chars().any(|c| c.is_ascii_digit());\n            if has_ver {\n                add(\n                    \"Medium\",\n                    \"Server header exposes version\",\n                    format!(\"Server: {}\", sv),\n                    None,\n                );\n            } else {\n                add(\n                    \"Low\",\n                    \"Server header exposes software\",\n                    format!(\"Server: {}\", sv),\n                    None,\n                );\n            }\n        }\n    }\n    if let Some(xpb) = headers.get(\"x-powered-by\").and_then(|v| v.to_str().ok()) {\n        if xpb.trim().len() \u003e 0 {\n            let has_ver = xpb.chars().any(|c| c.is_ascii_digit());\n            if has_ver {\n                add(\n                    \"Medium\",\n                    \"X-Powered-By exposes version\",\n                    format!(\"X-Powered-By: {}\", xpb),\n                    None,\n                );\n            } else {\n                add(\n                    \"Low\",\n                    \"X-Powered-By exposes technology\",\n                    format!(\"X-Powered-By: {}\", xpb),\n                    None,\n                );\n            }\n        }\n    }\n\n    // 5) CMS detection via meta generator / html markers / headers / cookies\n    // gen_vals computed above\n    let mut detected_cms: Option\u003c(String, Option\u003cString\u003e)\u003e = None; // (name, version)\n    let ver_re = Regex::new(r\"(?i)(\\d+\\.[\\d\\.]+)\").unwrap();\n\n    let mut consider_gen = |val: \u0026str| {\n        let v = val.to_lowercase();\n        let mut set = |name: \u0026str| {\n            let ver = ver_re\n                .captures(val)\n                .and_then(|c| c.get(1))\n                .map(|m| m.as_str().to_string());\n            detected_cms = Some((name.to_string(), ver));\n        };\n        if v.contains(\"wordpress\") {\n            set(\"WordPress\");\n        } else if v.contains(\"joomla\") {\n            set(\"Joomla\");\n        } else if v.contains(\"drupal\") {\n            set(\"Drupal\");\n        } else if v.contains(\"magento\") {\n            set(\"Magento\");\n        } else if v.contains(\"shopify\") {\n            set(\"Shopify\");\n        } else if v.contains(\"typo3\") {\n            set(\"TYPO3\");\n        } else if v.contains(\"prestashop\") {\n            set(\"PrestaShop\");\n        } else if v.contains(\"opencart\") {\n            set(\"OpenCart\");\n        } else if v.contains(\"ghost\") {\n            set(\"Ghost\");\n        } else if v.contains(\"wix\") {\n            set(\"Wix\");\n        } else if v.contains(\"squarespace\") {\n            set(\"Squarespace\");\n        } else if v.contains(\"contentful\") {\n            set(\"Contentful\");\n        } else if v.contains(\"hubspot\") {\n            set(\"HubSpot CMS\");\n        } else if v.contains(\"adobe experience manager\") || v.contains(\"aem\") {\n            set(\"Adobe Experience Manager\");\n        } else if v.contains(\"sitecore\") {\n            set(\"Sitecore\");\n        } else if v.contains(\"silverstripe\") {\n            set(\"SilverStripe\");\n        } else if v.contains(\"concrete\") {\n            set(\"Concrete CMS\");\n        } else if v.contains(\"modx\") {\n            set(\"MODX\");\n        } else if v.contains(\"pimcore\") {\n            set(\"Pimcore\");\n        } else if v.contains(\"bloomreach\") {\n            set(\"Bloomreach\");\n        }\n    };\n    for g in \u0026gen_vals {\n        consider_gen(g);\n    }\n\n    // HTML/content heuristics\n    if detected_cms.is_none() {\n        if lc.contains(\"wp-content/\") || lc.contain ders().clone();\n    let body = resp.text().await.unwrap_or_default();\n\n    let is_https = url.scheme() == \"https\";\n    if !is_https {\n        findings.push(Finding {\n            title: \"Site not using HTTPS\".into(),\n            description: \"The target URL is not using HTTPS. Use TLS to protect data in transit.\"\n                .into(),\n            severity: \"Medium\".into(),\n            url: Some(url.to_string()),\n        });\n    }\n\n    // Security headers presence\n    let check_header = |name: \u0026str| headers.get(name).is_some();\n    if !check_header(\"Strict-Transport-Security\") \u0026\u0026 is_https {\n        findings.push(Finding {\n            title: \"Missing HSTS\".into(),\n            description: \"Strict-Transport-Security header is missing over HTTPS.\".into(),\n            severity: \"Low\".into(),\n            url: Some(url.to_string()),\n        });\n    }\n    if !check_header(\"Content-Security-Policy\") {\n        findings.push(Finding {\n            title: \"Missing CSP\".into(),\n            description: \"Content-Security-Policy is not set; this increases XSS risk.\".into(),\n            severity: \"Medium\".into(),\n            url: Some(url.to_string()),\n        });\n    }\n    if !check_header(\"X-Frame-Options\") {\n        findings.push(Finding {\n            title: \"Missing X-Frame-Options\".into(),\n            description: \"Clickjacking protection missing (X-Frame-Options).\".into(),\n            severity: \"Low\".into(),\n            url: Some(url.to_string()),\n        });\n    }\n    if !check_header(\"X-Content-Type-Options\") {\n        findings.push(Finding {\n            title: \"Missing X-Content-Type-Options\".into(),\n            description: \"MIME sniffing not disabled (X-Content-Type-Options=nosniff).\".into(),\n            severity: \"Low\".into(),\n            url: Some(url.to_string()),\n        });\n    }\n    if !check_header(\"Referrer-Policy\") {\n        findings.push(Finding {\n rl: Some(url.to_string()),\n                    });\n                }\n                if !low.contains(\"httponly\") {\n                    findings.push(Finding {\n                        title: \"Cookie without HttpOnly\".into(),\n                        description: format!(\"Set-Cookie missing HttpOnly flag: {}\", val),\n                        severity: \"Low\".into(),\n                        url: Some(url.to_string()),\n                    });\n                }\n            }\n        }\n    }\n\n    Ok(VulnReport { findings })\n}\n","traces":[{"line":8,"address":[24515661,24515648],"length":1,"stats":{"Line":14}},{"line":9,"address":[24678007],"length":1,"stats":{"Line":4}},{"line":11,"address":[24678484,24678855,24678577,24678653],"length":1,"stats":{"Line":15}},{"line":12,"address":[24465576,24465644],"length":1,"stats":{"Line":10}},{"line":13,"address":[24835155],"length":1,"stats":{"Line":3}},{"line":14,"address":[24530553,24531504,24531841,24531620],"length":1,"stats":{"Line":8}},{"line":16,"address":[24680136,24680050],"length":1,"stats":{"Line":14}},{"line":17,"address":[23469580],"length":1,"stats":{"Line":2}},{"line":18,"address":[24724888,24725276],"length":1,"stats":{"Line":15}},{"line":19,"address":[24679796],"length":1,"stats":{"Line":3}},{"line":21,"address":[24110565],"length":1,"stats":{"Line":7}},{"line":22,"address":[24466715],"length":1,"stats":{"Line":1}},{"line":23,"address":[24628821,24628892],"length":1,"stats":{"Line":9}},{"line":28,"address":[24732531,24724946,24732512],"length":1,"stats":{"Line":8}},{"line":29,"address":[24679856,24680360],"length":1,"stats":{"Line":10}},{"line":30,"address":[24533233,24532908],"length":1,"stats":{"Line":5}},{"line":31,"address":[24636936],"length":1,"stats":{"Line":3}},{"line":32,"address":[24836670],"length":1,"stats":{"Line":1}},{"line":33,"address":[24651216],"length":1,"stats":{"Line":3}},{"line":34,"address":[24680650,24680721],"length":1,"stats":{"Line":4}},{"line":37,"address":[24533421,2
