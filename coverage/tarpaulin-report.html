        var data = {"files":[{"path":["/","home","lquessenberry","Custom Apps","dexteri","build.rs"],"content":"fn main() {\n    tauri_build::build()\n}\n","traces":[],"covered":0,"coverable":0},{"path":["/","home","lquessenberry","Custom Apps","dexteri","src","crawler.rs"],"content":"use anyhow::Result;\nuse futures::stream::{FuturesUnordered, StreamExt};\nuse serde_json::Value;\nuse std::collections::{HashSet, VecDeque};\nuse std::sync::{\n    atomic::{AtomicBool, Ordering},\n    Arc,\n};\nuse tokio::sync::mpsc::UnboundedSender;\nuse tokio::time::{Duration, Interval};\nuse url::Url;\n\nuse crate::models::{CrawlProgress, CrawlResult, LinkError, MarketingSignals, Page};\nuse crate::util;\n\nconst MAX_BODY_PREVIEW: usize = 2_000_000; // 2 MB cap\nconst LINK_CHECK_CONCURRENCY: usize = 64; // throttle external/internal link validations\n\npub async fn crawl(\n    client: \u0026reqwest::Client,\n    start: \u0026Url,\n    max_depth: usize,\n    concurrency: usize,\n    check_externals: bool,\n    include_subdomains: bool,\n) -\u003e Result\u003cCrawlResult\u003e {\n    crawl_with_logs(\n        client,\n        start,\n        max_depth,\n        concurrency,\n        check_externals,\n        include_subdomains,\n        None,\n        None,\n        None,\n        None,\n    )\n    .await\n}\n\npub async fn crawl_with_logs(\n    client: \u0026reqwest::Client,\n    start: \u0026Url,\n    max_depth: usize,\n    concurrency: usize,\n    check_externals: bool,\n    include_subdomains: bool,\n    log: Option\u003cUnboundedSender\u003cString\u003e\u003e,\n    progress: Option\u003cUnboundedSender\u003cCrawlProgress\u003e\u003e,\n    cancel_flag: Option\u003cArc\u003cAtomicBool\u003e\u003e,\n    rate_limit_rps: Option\u003cu32\u003e,\n) -\u003e Result\u003cCrawlResult\u003e {\n    let start = util::sanitize_url(start);\n    let mut visited: HashSet\u003cString\u003e = HashSet::new();\n    let mut q: VecDeque\u003c(Url, usize)\u003e = VecDeque::new();\n    q.push_back((start.clone(), 0));\n    visited.insert(start.as_str().to_string());\n\n    let mut pages: Vec\u003cPage\u003e = Vec::new();\n    let mut links_checked: usize = 0;\n    let mut broken: Vec\u003cLinkError\u003e = Vec::new();\n\n    let mut in_flight: FuturesUnordered\u003c_\u003e = FuturesUnordered::new();\n    let mut limiter: Option\u003cInterval\u003e = rate_limit_rps.map(|rps| {\n        let rps = if rps == 0 { 1 } else { rps };\n        let ms = std::cmp::max(1u32, 1000 / rps);\n        tokio::time::interval(Duration::from_millis(ms as u64))\n    });\n    // Heartbeat to indicate progress periodically even if no pages complete\n    let mut heartbeat = tokio::time::interval(Duration::from_secs(2));\n\n    if let Some(tx) = \u0026log {\n        let _ = tx.send(format!(\n            \"crawl start url={} depth={} concurrency={} externals={} include_subdomains={}\",\n            start, max_depth, concurrency, check_externals, include_subdomains\n        ));\n    }\n    let mut last_emit = std::time::Instant::now();\n    let mut emit = |force: bool,\n                    in_flight_len: usize,\n                    queue_len: usize,\n                    pages_len: usize,\n                    links: usize,\n                    broken_len: usize| {\n        if let Some(p) = \u0026progress {\n            let now = std::time::Instant::now();\n            if force || now.duration_since(last_emit).as_millis() \u003e= 200 {\n                let _ = p.send(CrawlProgress {\n                    pages_crawled: pages_len,\n                    links_checked: links,\n                    queue_size: queue_len,\n                    in_flight: in_flight_len,\n                    broken_links: broken_len,\n                });\n                last_emit = now;\n            }\n        }\n    };\n\n    while !q.is_empty() || !in_flight.is_empty() {\n        let cancelled = cancel_flag\n            .as_ref()\n            .map(|c| c.load(Ordering::Relaxed))\n            .unwrap_or(false);\n        if cancelled {\n            if let Some(tx) = \u0026log {\n                let _ = tx.send(\"cancel requested; clearing queue\".to_string());\n            }\n            q.clear();\n        }\n        while in_flight.len() \u003c concurrency {\n            if let Some((url, depth)) = q.pop_front() {\n                if let Some(tx) = \u0026log {\n                    let _ = tx.send(format!(\"dequeue depth={} url={}\", depth, url));\n                }\n                let client_cl = client.clone();\n                let log_cl = log.clone();\n                if cancelled {\n                    break;\n                }\n                if let Some(l) = \u0026mut limiter {\n                    l.tick().await;\n                }\n                in_flight.push(async move {\n                    let (page, new_links, errs) = fetch_and_parse(\n                        \u0026client_cl,\n                        \u0026url,\n                        MAX_BODY_PREVIEW,\n                        log_cl.clone(),\n                        check_externals,\n                    )\n                    .await\n                    .unwrap_or_else(|_| {\n                        (\n                            Page {\n                                url: url.as_str().to_string(),\n                                status: None,\n                                title: None,\n                                links: vec![],\n                                content_type: None,\n                                bytes: None,\n                                text: None,\n                                signals: None,\n                            },\n                            vec![],\n                            vec![LinkError {\n                                url: url.as_str().to_string(),\n                                status: None,\n                                reason: \"request error\".into(),\n                                parent: url.as_str().to_string(),\n                                external: false,\n                            }],\n                        )\n                    });\n                    (url, depth, page, new_links, errs)\n                });\n            } else {\n                break;\n            }\n        }\n\n        if in_flight.is_empty() {\n            // Nothing currently in flight; loop will either push more or exit\n            continue;\n        }\n        tokio::select! {\n            _ = heartbeat.tick() =\u003e {\n                if let Some(tx) = \u0026log { let _ = tx.send(format!(\"heartbeat queue={} in_flight={} pages={} links_checked={}\", q.len(), in_flight.len(), pages.len(), links_checked)); }\n                emit(false, in_flight.len(), q.len(), pages.len(), links_checked, broken.len());\n            }\n            maybe = in_flight.next() =\u003e {\n                if let Some((u, depth, page, new_links, errs)) = maybe {\n                    let start_origin = u.clone();\n                    if let Some(tx) = \u0026log { let _ = tx.send(format!(\"page complete depth={} url={} checked_links={} new_errors={}\", depth, u, new_links.len(), errs.len())); }\n                    pages.push(page);\n                    links_checked += new_links.len();\n                    broken.extend(errs.into_iter().filter(|e| e.status.unwrap_or(0) \u003e= 400 || e.status.is_none()));\n                    emit(true, in_flight.len(), q.len(), pages.len(), links_checked, broken.len());\n\n                    if depth \u003c max_depth \u0026\u0026 !cancelled {\n                        let mut enq_count = 0usize;\n                        let mut visited_skip = 0usize;\n                        let mut external_cnt = 0usize;\n                        for l in new_links {\n                            if let Ok(u) = Url::parse(\u0026l) {\n                                let u = util::sanitize_url(\u0026u);\n                                let same = if include_subdomains {\n                                    util::is_same_host_or_ log { let _ = tx.send(format!(\"progress: pages={} links_checked={} queue_size={} in_flight={}\", pages.len(), links_checked, q.len(), in_flight.len())); }\n                        emit(false, in_flight.len(), q.len(), pages.len(), links_checked, broken.len());\n                    } else {\n                        if let Some(tx) = \u0026log { let _ = tx.send(format!(\"max depth reached at depth={} for url={}\", depth, u)); }\n                    }\n                }\n            }\n        }\n    }\n\n    emit(\n        true,\n        in_flight.len(),\n        q.len(),\n        pages.len(),\n        links_checked,\n        broken.len(),\n    );\n\n    Ok(CrawlResult {\n        pages_crawled: pages.len(),\n        links_checked,\n        broken_links: broken,\n        pages,\n    })\n}\n\nasync fn fetch_and_parse(\n    client: \u0026reqwest::Client,\n    url: \u0026Url,\n    max_bytes: usize,\n    log: Option\u003cUnboundedSender\u003cString\u003e\u003e,\n    check_externals: bool,\n) -\u003e Result\u003c(Page, Vec\u003cString\u003e, Vec\u003cLinkError\u003e)\u003e {\n    if let Some(tx) = \u0026log {\n        let _ = tx.send(format!(\"GET {}\", url));\n    }\n    let resp = client.get(url.clone()).send().await;\n    if let Err(e) = \u0026resp {\n        if let Some(tx) = \u0026log {\n            let _ = tx.send(format!(\"GET error {}: {}\", url, e));\n        }\n        return Ok((\n            Page {\n                url: url.as_str().to_string(),\n                status: None,\n                title: None,\n                links: vec![],\n                content_type: None,\n                bytes: None,\n                text: None,\n                signals: None,\n            },\n            vec![],\n            vec![LinkError {\n                url: url.as_str().to_string(),\n                status: None,\n                reason: format!(\"request error: {}\", e),\n                parent: url.as_str().to_string(),\n                external: false,\n            }],\n        ));\n    }\n    let resp = resp?;\n    let status = resp.status();\n    let content_type = resp\n        .headers()\n        .get(reqwest::header::CONTENT_TYPE)\n        .and_then(|v| v.to_str().ok())\n        .map(|s| s.to_string());\n\n    let body_full = resp.bytes().await.unwrap_or_default();\n    let body_len_total = body_full.len();\n    let body = if body_len_total \u003e max_bytes {\n        body_full.slice(0..max_bytes)\n    } else {\n        body_full\n    };\n    let body_string = String::from_utf8_lossy(\u0026body).to_string();\n\n    if let Some(tx) = \u0026log {\n        let _ = tx.send(format!(\n            \"status={} ct={} bytes={} url={}\",\n            status.as_u16(),\n            content_type.as_deref().unwrap_or(\"-\"),\n            body_len_total,\n            url\n        ));\n    }\n    let mut links: Vec\u003cString\u003e = Vec::new();\n    let mut page_title: Option\u003cString\u003e = None;\n    let mut link_errors: Vec\u003cLinkError\u003e = Vec::new();\n\n    let mut signals: Option\u003cMarketingSignals\u003e = None;\n    if content_type\n        .as_deref()\n        .unwrap_or(\"\")\n        .starts_with(\"text/html\")\n    {\n        let doc = scraper::Html::parse_document(\u0026body_string);\n        let sel_a = scraper::Selector::parse(\"a[href]\").unwrap();\n        let sel_img = scraper::Selector::parse(\"img[src]\").unwrap();\n        let sel_link = scraper::Selector::parse(\"link[href]\").unwrap();\n        let sel_script = scraper::Selector::parse(\"script[src]\").unwrap();\n        let sel_title = scraper::Selector::parse(\"title\").unwrap();\n        let sel_meta_prop_og = scraper::Selector::parse(r#\"meta[property^=\"og:\"]\"#).unwrap();\n        let sel_meta_twitter = scraper::Selector::parse(r#\"meta[name^=\"twitter:\"]\"#).unwrap();\n        let sel_meta_robots = scraper::Selector::parse(\"meta[name=robots]\").unwrap();\n        let sel_link_canon = scraper::Selector::parse(\"link[rel=canonical]\").unwrap(); afa} .sev-Info{color:#555}.sev-Low{color:#2a7}.sev-Medium{color:#d88400}.sev-High{color:#d33}.sev-Critical{color:#a00;font-weight:bold}\");\n    html.push_str(\".summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:1rem;margin:1rem 0} .card{border:1px solid #ddd;border-radius:8px;padding:1rem;background:#fff}\");\n    html.push_str(\"\u003c/style\u003e\u003c/head\u003e\u003cbody\u003e\");\n\n    html.push_str(\u0026format!(\n        \"\u003ch1\u003eDexteri++ Report\u003c/h1\u003e\u003cp\u003eTarget: \u003ca href=\\\"{}\\\"\u003e{}\u003c/a\u003e\u003c/p\u003e\",\n        start, start\n    ));\n\n    html.push_str(\"\u003csection class=\\\"summary\\\"\u003e\");\n    html.push_str(\u0026format!(\n        \"\u003cdiv class=\\\"card\\\"\u003e\u003cb\u003ePages crawled\u003c/b\u003e\u003cdiv style=\\\"font-size:1.4rem\\\"\u003e{}\u003c/div\u003e\u003c/div\u003e\",\n        crawl.pages_crawled\n    ));\n    html.push_str(\u0026format!(\n        \"\u003cdiv class=\\\"card\\\"\u003e\u003cb\u003eLinks checked\u003c/b\u003e\u003cdiv style=\\\"font-size:1.4rem\\\"\u003e{}\u003c/div\u003e\u003c/div\u003e\",\n        crawl.links_checked\n    ));\n    html.push_str(\u0026format!(\n        \"\u003cdiv class=\\\"card\\\"\u003e\u003cb\u003eBroken links\u003c/b\u003e\u003cdiv style=\\\"font-size:1.4rem\\\"\u003e{}\u003c/div\u003e\u003c/div\u003e\",\n        crawl.broken_links.len()\n    ));\n    html.push_str(\u0026format!(\n        \"\u003cdiv class=\\\"card\\\"\u003e\u003cb\u003eOpen ports\u003c/b\u003e\u003cdiv style=\\\"font-size:1.4rem\\\"\u003e{}\u003c/div\u003e\u003c/div\u003e\",\n        ports.open_ports.len()\n    ));\n    html.push_str(\u0026format!(\n        \"\u003cdiv class=\\\"card\\\"\u003e\u003cb\u003eVuln findings\u003c/b\u003e\u003cdiv style=\\\"font-size:1.4rem\\\"\u003e{}\u003c/div\u003e\u003c/div\u003e\",\n        vuln.findings.len()\n    ));\n    html.push_str(\"\u003c/section\u003e\");\n\n    // Marketing / Structured Data Signals (summary)\n    let mut json_ld_total = 0usize;\n    let mut microdata_total = 0usize;\n    let mut og_total = 0usize;\n    let mut tw_total = 0usize;\n    let mut robots_pages = 0usize;\n    let mut canonical_pages = 0usize;\n    let mut hreflang_total = 0usize;\n    let mut tracker_counts: HashMap\u003cString, usize\u003e = HashMap::new();\n    for p in \u0026crawl.pages {\n        if let Some(s) = \u0026p.signals {\n            json_ld_total += s.json_ld_blocks;\n            microdata_total += s.microdata_items;\n            og_total += s.open_graph_tags;\n            tw_total += s.twitter_tags;\n            if s.meta_robots.as_deref().unwrap_or(\"\").len() \u003e 0 {\n                robots_pages += 1;\n            }\n            if s.canonical_url.as_deref().unwrap_or(\"\").len() \u003e 0 {\n                canonical_pages += 1;\n            }\n            hreflang_total += s.hreflang_count;\n            for t in \u0026s.trackers {\n                *tracker_counts.entry(t.clone()).or_insert(0) += 1;\n            }\n        }\n    }\n    if !crawl.pages.is_empty() {\n        html.push_str(\"\u003ch2\u003eMarketing \u0026 Structured Data\u003c/h2\u003e\");\n        html.push_str(\"\u003cdiv class=\\\"summary\\\"\u003e\");\n        html.push_str(\u0026format!(\"\u003cdiv class=\\\"card\\\"\u003e\u003cb\u003eJSON-LD blocks\u003c/b\u003e\u003cdiv style=\\\"font-size:1.4rem\\\"\u003e{}\u003c/div\u003e\u003c/div\u003e\", json_ld_total));\n        html.push_str(\u0026format!(\"\u003cdiv class=\\\"card\\\"\u003e\u003cb\u003eMicrodata items\u003c/b\u003e\u003cdiv style=\\\"font-size:1.4rem\\\"\u003e{}\u003c/div\u003e\u003c/div\u003e\", microdata_total));\n        html.push_str(\u0026format!(\"\u003cdiv class=\\\"card\\\"\u003e\u003cb\u003eOpenGraph tags\u003c/b\u003e\u003cdiv style=\\\"font-size:1.4rem\\\"\u003e{}\u003c/div\u003e\u003c/div\u003e\", og_total));\n        html.push_str(\u0026format!(\n            \"\u003cdiv class=\\\"card\\\"\u003e\u003cb\u003eTwitter tags\u003c/b\u003e\u003cdiv style=\\\"font-size:1.4rem\\\"\u003e{}\u003c/div\u003e\u003c/div\u003e\",\n            tw_total\n        ));\n        html.push_str(\u0026format!(\"\u003cdiv class=\\\"card\\\"\u003e\u003cb\u003ePages with robots\u003c/b\u003e\u003cdiv style=\\\"font-size:1.4rem\\\"\u003e{}\u003c/div\u003e\u003c/div\u003e\", robots_pages));\n        html.push_str(\u0026format!(\"\u003cdiv class=\\\"card\\\"\u003e\u003cb\u003ePages with canonical\u003c/b\u003e\u003cdiv style=\\\"font-size:1.4rem\\\"\u003e{}\u003c/div\u003e\u003c/div\u003e\", canonical_pages));\n        html.push_str(\u0026format!(\"\u003cdiv class=\\\"card\\\"\u003e\u003cb\u003eHreflang links\u003c/b\u003e\u003cdiv style=\\\"font-size:1.4rem\\\"\u003e{}\u003c/div\u003e\u003c/div\u003e\", hreflang_total));\n        html.push_str(\"\u003c/div\u003e\");\n\n        // Charts: marketing summary + top trackers\n        let labels = vec![\n            \"JSON-LD\".to_string(),\n            \"Microdata\".to_string(),\n            \"OpenGraph\".to_string(),\n            \"Twitter\".to_string(),\n            \"Robots\".to_string(),\n            \"Canonical\".to_string(),\n            \"Hreflang\".to_string(),\n        ];\n        let values = vec![\n            json_ld_total as i32,\n            microdata_total as i32,\n            og_total as i32,\n            tw_total as i32,\n            robots_pages as i32,\n            canonical_pages as i32,\n            hreflang_total as i32,\n        ];\n        if let Some(svg) = chart_svg_bar(\u0026labels, \u0026values, \"Marketing Signals Totals\", 900, 280) {\n            html.push_str(\"\u003ch3\u003eCharts\u003c/h3\u003e\");\n            html.push_str(\u0026svg);\n        }\n\n        // Trackers table\n        if !tracker_counts.is_empty() {\n            let mut trackers: Vec\u003c(String, usize)\u003e = tracker_counts.into_iter().collect();\n            trackers.sort_by(|a, b| b.1.cmp(\u0026a.1).then(a.0.cmp(\u0026b.0)));\n            html.push_str(\"\u003ch3\u003eDetected Trackers (by pages)\u003c/h3\u003e\");\n            // Top trackers bar chart\n            let top_n: Vec\u003c(String, usize)\u003e = trackers.iter().take(10).cloned().collect();\n            if !top_n.is_empty() {\n                let labels2: Vec\u003cString\u003e = top_n.iter().map(|(k, _)| k.clone()).collect();\n                let values2: Vec\u003ci32\u003e = top_n.iter().map(|(_, v)| *v as i32).collect();\n                if let Some(svg2) =\n                    chart_svg_bar(\u0026labels2, \u0026values2, \"Top Trackers (pages)\", 900, 280)\n                {\n                    html.push_str(\u0026svg2);\n                }\n            }\n            html.push_str(\"\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eTracker\u003c/th\u003e\u003cth\u003ePages\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\");\n            for (name, count) in trackers.iter().take(50) {\n                html.push_str(\u0026format!(\n                    \"\u003ctr\u003e\u003ctd\u003e{}\u003c/td\u003e\u003ctd\u003e{}\u003c/td\u003e\u003c/tr\u003e\",\n                    html_escape::encode_text(name),\n                    count\n                ));\n            }\n            html.push_str(\"\u003c/tbody\u003e\u003c/table\u003e\");\n        } else {\n            html.push_str(\"\u003cp\u003eNo known tracker libraries detected.\u003c/p\u003e\");\n        }\n\n        // Per-page details (top 50)\n        html.push_str(\"\u003ch3\u003ePer-page Marketing Details (top 50)\u003c/h3\u003e\");\n        html.push_str(\"\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eURL\u003c/th\u003e\u003cth\u003eRobots\u003c/th\u003e\u003cth\u003eCanonical\u003c/th\u003e\u003cth\u003eJSON-LD types\u003c/th\u003e\u003cth\u003eMicrodata types\u003c/th\u003e\u003cth\u003eOG tags\u003c/th\u003e\u003cth\u003eTwitter tags\u003c/th\u003e\u003cth\u003eHreflang\u003c/th\u003e\u003cth\u003eTrackers\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\");\n        for p in crawl.pages.iter().take(50) {\n            let (robots, canon, jtypes, mtypes, ogc, twc, hreflang, trackers) = match \u0026p.signals {\n                Some(s) =\u003e (\n                    html_escape::encode_text(s.meta_robots.as_deref().unwrap_or(\"\")).into_owned(),\n                    html_escape::encode_text(s.canonical_url.as_deref().unwrap_or(\"\")).into_owned(),\n                    html_escape::encode_text(\u0026s.json_ld_types.join(\", \")).into_owned(),\n                    html_escape::encode_text(\u0026s.microdata_types.join(\", \")).into_owned(),\n                    s.open_graph_tags.to_string(),\n                    s.twitter_tags.to_string(),\n                    s.hreflang_count.to_string(),\n                    html_escape::encode_text(\u0026s.trackers.join(\", \")).into_owned(),\n                ),\n                None =\u003e (\n                    \"\".into(),\n                    \"\".into(),\n                    \"\".into(),\n                    \"\".into(),\n                    \"0\".into(),\n                    \"0\".into(),\n                    \"0\".into(),\n                    \"\".into(),\n                ),\n            };\n            html.push_str(\u0026format!(\n                \"\u003ctr\u003e\u003ctd class=\\\"trunc\\\"\u003e\u003ca href=\\\"{u}\\\"\u003e{u}\u003c/a\u003e\u003c/td\u003e\u003ctd\u003e{r}\u003c/td\u003e\u003ctd class=\\\"trunc\\\"\u003e{c}\u003c/td\u003e\u003ctd class=\\\"trunc\\\"\u003e{jt}\u003c/td\u003e\u003ctd class=\\\"trunc\\\"\u003e{mt}\u003c/td\u003e\u003ctd\u003e{og}\u003c/td\u003e\u003ctd\u003e{tw}\u003c/td\u003e\u003ctd\u003e{hl}\u003c/td\u003e\u003ctd class=\\\"trunc\\\"\u003e{tk}\u003c/td\u003e\u003c/tr\u003e\",\n                u = p.url,\n                r = robots,\n                c = canon,\n                jt = jtypes,\n                mt = mtypes,\n                og = ogc,\n                tw = twc,\n                hl = hreflang,\n                tk = trackers\n            ));\n        }\n        html.push_str(\"\u003c/tbody\u003e\u003c/table\u003e\");\n    }\n\n    // Broken links\n    html.push_str(\"\u003ch2\u003eBroken links\u003c/h2\u003e\");\n    if crawl.broken_links.is_empty() {\n        html.push_str(\"\u003cp\u003eNo broken links found. 🎉\u003c/p\u003e\");\n    } else {\n        html.push_str(\"\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eStatus\u003c/th\u003e\u003cth\u003eURL\u003c/th\u003e\u003cth\u003eParent\u003c/th\u003e\u003cth\u003eExternal\u003c/th\u003e\u003cth\u003eReason\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\");\n        for e in \u0026crawl.broken_links {\n            html.push_str(\u0026format!(\n                \"\u003ctr\u003e\u003ctd\u003e{}\u003c/td\u003e\u003ctd\u003e\u003ca href=\\\"{}\\\"\u003e{}\u003c/a\u003e\u003c/td\u003e\u003ctd\u003e\u003ca href=\\\"{}\\\"\u003e{}\u003c/a\u003e\u003c/td\u003e\u003ctd\u003e{}\u003c/td\u003e\u003ctd\u003e\u003ccode\u003e{}\u003c/code\u003e\u003c/td\u003e\u003c/tr\u003e\",\n                e.status.map(|s| s.to_string()).unwrap_or_else(|| \"-\".into()),\n                \u0026e.url,\n                \u0026e.url,\n                \u0026e.parent,\n                \u0026e.parent,\n                if e.external { \"yes\" } else { \"no\" },\n                html_escape::encode_text(\u0026e.reason)\n            ));\n        }\n        html.push_str(\"\u003c/tbody\u003e\u003c/table\u003e\");\n    }\n\n    // Ports\n    html.push_str(\"\u003ch2\u003eOpen ports\u003c/h2\u003e\");\n    if ports.open_ports.is_empty() {\n        html.push_str(\"\u003cp\u003eNo open ports detected from the scanned set.\u003c/p\u003e\");\n    } else {\n        html.push_str(\"\u003cp\u003eOpen (subset scanned):\u003c/p\u003e\u003cul\u003e\");\n        for p in \u0026ports.open_ports {\n            html.push_str(\u0026format!(\"\u003cli\u003e\u003ccode\u003e{}\u003c/code\u003e\u003c/li\u003e\", p));\n        }\n        html.push_str(\"\u003c/ul\u003e\");\n    }\n\n    // Vulns\n    html.push_str(\"\u003ch2\u003eVulnerability findings\u003c/h2\u003e\");\n    if vuln.findings.is_empty() {\n        html.push_str(\"\u003cp\u003eNo obvious security misconfigurations detected by basic checks.\u003c/p\u003e\");\n    } else {\n        html.push_str(\"\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eSeverity\u003c/th\u003e\u003cth\u003eTitle\u003c/th\u003e\u003cth\u003eDescription\u003c/th\u003e\u003cth\u003eURL\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\");\n        for f in \u0026vuln.findings {\n            html.push_str(\u0026format!(\n                \"\u003ctr\u003e\u003ctd class=\\\"sev-{}\\\"\u003e{}\u003c/td\u003e\u003ctd\u003e{}\u003c/td\u003e\u003ctd\u003e{}\u003c/td\u003e\u003ctd\u003e{}\u003c/td\u003e\u003c/tr\u003e\",\n                f.severity,\n                f.severity,\n                html_escape::encode_text(\u0026f.title),\n                html_escape::encode_text(\u0026f.description),\n                f.url\n                    .as_ref()\n                    .map(|u| format!(\"\u003ca href=\\\\\\\"{}\\\\\\\"\u003elink\u003c/a\u003e\", u))\n                    .unwrap_or_else(|| \"-\".into())\n            ));\n        }\n        html.push_str(\"\u003c/tbody\u003e\u003c/table\u003e\");\n    }\n\n    // Security posture\n    html.push_str(\"\u003ch2\u003eSecurity Posture\u003c/h2\u003e\");\n    if security.is_empty() {\n        html.push_str(\"\u003cp\u003eNo security posture flags detected.\u003c/p\u003e\");\n    } else {\n        html.push_str(\"\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eLevel\u003c/th\u003e\u003cth\u003eTitle\u003c/th\u003e\u003cth\u003eDescription\u003c/th\u003e\u003cth\u003eURL\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\");\n        for f in security {\n            html.push_str(\u0026format!(\n                \"\u003ctr\u003e\u003ctd class=\\\"sev-{}\\\"\u003e{}\u003c/td\u003e\u003ctd\u003e{}\u tml.as_bytes())?;\n    Ok(())\n}\n\nfn chart_svg_bar(\n    labels: \u0026[String],\n    values: \u0026[i32],\n    title: \u0026str,\n    width: u32,\n    height: u32,\n) -\u003e Option\u003cString\u003e {\n    if labels.is_empty() || values.is_empty() || labels.len() != values.len() {\n        return None;\n    }\n    let max_v = values.iter().cloned().max().unwrap_or(0).max(1);\n    let mut svg = String::new();\n    {\n        let root = SVGBackend::with_string(\u0026mut svg, (width, height)).into_drawing_area();\n        root.fill(\u0026WHITE).ok()?;\n        let x_range = 0..(values.len() as i32);\n        let y_range = 0..(max_v + (max_v / 5).max(1));\n        let mut chart = ChartBuilder::on(\u0026root)\n            .margin(10)\n            .caption(title, (\"sans-serif\", 16))\n            .x_label_area_size(40)\n            .y_label_area_size(40)\n            .build_cartesian_2d(x_range.clone(), y_range.clone())\n            .ok()?;\n        chart\n            .configure_mesh()\n            .disable_mesh()\n            .x_labels(values.len())\n            .y_desc(\"Count\")\n            .x_label_formatter(\u0026|v| {\n                let i = (*v as usize).min(labels.len().saturating_sub(1));\n                if labels.is_empty() {\n                    \"\".to_string()\n                } else {\n                    labels[i].clone()\n                }\n            })\n            .label_style((\"sans-serif\", 10))\n            .axis_desc_style((\"sans-serif\", 12))\n            .draw()\n            .ok()?;\n\n        let bar_color = RGBColor(86, 156, 214).mix(0.9);\n        for (i, \u0026v) in values.iter().enumerate() {\n            let x0 = i as i32;\n            let x1 = x0 + 1;\n            let rect = Rectangle::new([(x0, 0), (x1, v)], bar_color.filled());\n            chart.draw_series(std::iter::once(rect)).ok()?;\n        }\n        root.present().ok()?;\n        // chart and root drop here before returning svg\n    }\n    Some(svg)\n}\n","traces":[{"li            None,\n        );\n    }\n\n    // 4) Server exposure via headers\n    if let Some(sv) = headers.get(SERVER).and_then(|v| v.to_str().ok()) {\n        if sv.trim().len() \u003e 0 {\n            // With version -\u003e Medium, otherwise Low\n            let has_ver = sv.chars().any(|c| c.is_ascii_digit());\n            if has_ver {\n                add(\n                    \"Medium\",\n                    \"Server header exposes version\",\n                    format!(\"Server: {}\", sv),\n                    None,\n                );\n            } else {\n                add(\n                    \"Low\",\n                    \"Server header exposes software\",\n                    format!(\"Server: {}\", sv),\n                    None,\n                );\n            }\n        }\n    }\n    if let Some(xpb) = headers.get(\"x-powered-by\").and_then(|v| v.to_str().ok()) {\n        if xpb.trim().len() \u003e 0 {\n            let has_ver = xpb.chars().any(|c| c.is_ascii_digit());\n            if has_ver {\n                add(\n                    \"Medium\",\n                    \"X-Powered-By exposes version\",\n                    format!(\"X-Powered-By: {}\", xpb),\n                    None,\n                );\n            } else {\n                add(\n                    \"Low\",\n                    \"X-Powered-By exposes technology\",\n                    format!(\"X-Powered-By: {}\", xpb),\n                    None,\n                );\n            }\n        }\n    }\n\n    // 5) CMS detection via meta generator / html markers / headers / cookies\n    // gen_vals computed above\n    let mut detected_cms: Option\u003c(String, Option\u003cString\u003e)\u003e = None; // (name, version)\n    let ver_re = Regex::new(r\"(?i)(\\d+\\.[\\d\\.]+)\").unwrap();\n\n    let mut consider_gen = |val: \u0026str| {\n        let v = val.to_lowercase();\n        let mut set = |name: \u0026str| {\n            let ver = ver_re\n                .captures(val)\n                .and_then(|c| c.get(1))\n                .map(|m| m.as_str().to_string());\n            detected_cms = Some((name.to_string(), ver));\n        };\n        if v.contains(\"wordpress\") {\n            set(\"WordPress\");\n        } else if v.contains(\"joomla\") {\n            set(\"Joomla\");\n        } else if v.contains(\"drupal\") {\n            set(\"Drupal\");\n        } else if v.contains(\"magento\") {\n            set(\"Magento\");\n        } else if v.contains(\"shopify\") {\n            set(\"Shopify\");\n        } else if v.contains(\"typo3\") {\n            set(\"TYPO3\");\n        } else if v.contains(\"prestashop\") {\n            set(\"PrestaShop\");\n        } else if v.contains(\"opencart\") {\n            set(\"OpenCart\");\n        } else if v.contains(\"ghost\") {\n            set(\"Ghost\");\n        } else if v.contains(\"wix\") {\n            set(\"Wix\");\n        } else if v.contains(\"squarespace\") {\n            set(\"Squarespace\");\n        } else if v.contains(\"contentful\") {\n            set(\"Contentful\");\n        } else if v.contains(\"hubspot\") {\n            set(\"HubSpot CMS\");\n        } else if v.contains(\"adobe experience manager\") || v.contains(\"aem\") {\n            set(\"Adobe Experience Manager\");\n        } else if v.contains(\"sitecore\") {\n            set(\"Sitecore\");\n        } else if v.contains(\"silverstripe\") {\n            set(\"SilverStripe\");\n        } else if v.contains(\"concrete\") {\n            set(\"Concrete CMS\");\n        } else if v.contains(\"modx\") {\n            set(\"MODX\");\n        } else if v.contains(\"pimcore\") {\n            set(\"Pimcore\");\n        } else if v.contains(\"bloomreach\") {\n            set(\"Bloomreach\");\n        }\n    };\n    for g in \u0026gen_vals {\n        consider_gen(g);\n    }\n\n    // HTML/content heuristics\n    if detected_cms.is_none() {\n        if lc.contains(\"wp-content/\") || lc.contains(\"wp-includes/\") {\n            detected_cms = Some((\"WordPress\".into(), None));\n        }\n        if lc.contains(\"static.squarespace.com\") {\n            detected_cms = Some((\"Squarespace\".into(), None));\n        }\n        if lc.contains(\"cdn.shopify.com\") || headers.contains_key(\"x-shopify-stage\") {\n            detected_cms = Some((\"Shopify\".into(), None));\n        }\n        if lc.contains(\"wix.com\") || headers.contains_key(\"x-wix-request-id\") {\n            detected_cms = Some((\"Wix\".into(), None));\n        }\n        if lc.contains(\"Drupal.settings\") || lc.contains(\"drupal.js\") {\n            detected_cms = Some((\"Drupal\".into(), None));\n        }\n        if lc.contains(\"requirejs-config.js\") \u0026\u0026 lc.contains(\"mage\") {\n            detected_cms = Some((\"Magento\".into(), None));\n        }\n        if lc.contains(\"typo3/\") {\n            detected_cms = Some((\"TYPO3\".into(), None));\n        }\n        if lc.contains(\"ghost-sdk\") || lc.contains(\"ghost\") {\n            detected_cms = Some((\"Ghost\".into(), None));\n        }\n    }\n\n    if let Some((name, ver)) = \u0026detected_cms {\n        add(\n            \"Info\",\n            \u0026format!(\"CMS detected: {}\", name),\n            ver.clone()\n                .map(|v| format!(\"Version: {}\", v))\n                .unwrap_or_else(|| \"\".into()),\n            None,\n        );\n        // Version exposure / outdated\n        if let Some(v) = ver {\n            add(\n                \"Medium\",\n                \u0026format!(\"{} version exposed\", name),\n                format!(\"Version {} visible in generator/meta\", v),\n                None,\n            );\n            let outdated = match name.as_str() {\n                \"WordPress\" =\u003e is_version_less(v, \"6.0\"),\n                \"Magento\" =\u003e is_version_less(v, \"2.4\"),\n                _ =\u003e false,\n            };\n            if outdated {\n                add(\n                    \"High\",\n                    \u0026format!(\"Outdated {} version\", name),\n                    format!(\n                        \"{} \u003c {}; known exploits likely\",\n                        v,\n                        if name == \"WordPress\" { \"6.0\" } else { \"2.4\" }\n                    ),\n                    None,\n                );\n            }\n        }\n    }\n\n    // 6) Frontend framework hints (Low)\n    let mut fw: Vec\u003c\u0026str\u003e = Vec::new();\n    if lc.contains(\"react\") {\n        fw.push(\"React\");\n    }\n    if lc.contains(\"vue\") || lc.contains(\"v-bind\") {\n        fw.push(\"Vue\");\n    }\n    if lc.contains(\"angular\") || lc.contains(\"ng-app\") {\n        fw.push(\"Angular\");\n    }\n    if lc.contains(\"vite\") {\n        fw.push(\"Vite\");\n    }\n    if lc.contains(\"next\") {\n        fw.push(\"Next.js\");\n    }\n    if lc.contains(\"svelte\") {\n        fw.push(\"Svelte\");\n    }\n    if !fw.is_empty() {\n        add(\"Low\", \"Frontend framework detected\", fw.join(\", \"), None);\n    }\n\n    // 7) CMS-specific and sensitive paths (HEAD first, fallback to GET range)\n    let mut paths: Vec\u003c(\u0026str, \u0026str, \u0026str)\u003e = vec![\n        // path, level, title\n        (\"/.git/\", \"Critical\", \".git directory exposed\"),\n        (\"/.env\", \"Critical\", \".env file exposed\"),\n        (\"/phpinfo.php\", \"High\", \"phpinfo exposed\"),\n        (\"/config.php\", \"High\", \"config.php exposed\"),\n        (\"/backup.zip\", \"High\", \"Backup archive exposed\"),\n        (\"/node_modules/\", \"Medium\", \"node_modules directory exposed\"),\n        (\"/server-status\", \"High\", \"Apache server-status exposed\"),\n        (\"/status\", \"Medium\", \"Server status endpoint exposed\"),\n        // CMS/admin areas\n        (\"/administrator/\", \"High\", \"Joomla admin exposed\"),\n        (\"/admin/\", \"High\", \"Admin area exposed\"),\n        (\"/adminhtml/\", \"High\", \"Magento admin exposed\"),\n        (\"/typo3/\", \"High\", \"TYPO3 backend exposed\"),\n        (\"/ghost/\", \"High\", \"Ghost admin exposed\"),\n        (\"/CHANGELOG.txt\", \"Medium\", \"Drupal changelog exposed\"),\n        (\"/xmlrpc.php\", \"Medium\", \"WordPress XML-RPC enabled\"),\n        (\"/wp-login.php\", \"Low\", \"WordPress login present\"),\n    ];\n\n    let mut checked = 0usize;\n    for (p, level, title) in paths.drain(..) {\n        if checked \u003e= 10 {\n            break;\n        }\n        if let Some(u) = base.join(p).ok() {\n            if let Some((st, body_snip)) = head_or_get_snippet(client, \u0026u).await {\n                let good = st.is_success() || st.as_u16() == 401 || st.as_u16() == 403;\n                if good {\n                    // Avoid false positives on custom 404 pages by checking for obvious \"not found\"\n                    let body_lc = body_snip.to_lowercase();\n                    let looks_404 = body_lc.contains(\"not found\") \u0026\u0026 !st.is_success();\n                    if !looks_404 {\n                        add(\n                            level,\n                            title,\n                            format!(\"{} returned status {}\", u, st.as_u16()),\n                            Some(u.to_string()),\n                        );\n                        checked += 1;\n                    }\n                }\n            }\n        }\n    }\n\n    Ok(flags)\n}\n\nasync fn head_or_get_snippet(\n    client: \u0026reqwest::Client,\n    url: \u0026Url,\n) -\u003e Option\u003c(reqwest::StatusCode, String)\u003e {\n    // Try HEAD\n    match client\n        .head(url.clone())\n        .timeout(Duration::from_secs(10))\n        .send()\n        .await\n    {\n        Ok(r) =\u003e {\n            let st = r.status();\n            return Some((st, String::new()));\n        }\n        Err(_) =\u003e {}\n    }\n    // Fallback to GET with range\n    match client\n        .get(url.clone())\n        .header(reqwest::header::RANGE, \"bytes=0-1023\")\n        .timeout(Duration::from_secs(15))\n        .send()\n        .await\n    {\n        Ok(r) =\u003e {\n            let st = r.status();\n            let body = r.text().await.unwrap_or_default();\n            Some((st, body))\n        }\n        Err(_) =\u003e None,\n    }\n}\n\nfn is_version_less(a: \u0026str, b: \u0026str) -\u003e bool {\n    // Compare a \u003c b using dot-separated integers\n    let pa: Vec\u003cu64\u003e = a.split('.').filter_map(|x| x.parse::\u003cu64\u003e().ok()).collect();\n    let pb: Vec\u003cu64\u003e = b.split('.').filter_map(|x| x.parse::\u003cu64\u003e().ok()).collect();\n    let n = pa.len().max(pb.len());\n    for i in 0..n {\n        let xa = *pa.get(i).unwrap_or(\u00260);\n        let xb = *pb.get(i).unwrap_or(\u00260);\n        if xa \u003c xb {\n            return true;\n        }\n        if xa \u003e xb {\n            return false;\n        }\n    }\n    false\n}\n","traces":[{"line":10,"address":[23212848],"length":1,"stats":{"Line":10}},{"line":14,"address":[24545415],"length":1,"stats":{"Line":9}},{"line":17,"address":[24445392,24444954,24445074,24445181],"length":1,"stats":{"Line":31}},{"line":18,"address":[24445765],"length":1,"stats":{"Line":10}},{"line":19,"address":[24397738],"length":1,"stats":{"Line":0}},{"line":20,"address":[24471722,24472725],"length":1,"stats":{"Line":0}},{"line":21,"address":[24471736],"length":1,"stats":{"Line":0}},{"line":22,"address":[24288302],"length":1,"stats":{"Line":0}},{"line":23,"address":[24708304,24708213],"length":1,"stats":{"Line":0}},{"line":24,"address":[24446551,24446629],"length":1,"stats":{"Line":0}},{"line":26,"address":[58139079],"length":1,"stats":{"Line":0}},{"line":29,"address":[24445828,24445907],"length":1,"stats":{"Line":18}},{"line":30,"address":[26541515],"length":1,"stats":{"Line":10}},{"line":31,"address":[22672347],"length":1,"stats":{"Line":20}},{"line":35,"address":[24473352,24473449],"length":1,"stats":{"Line":23}},{"line":36,"address":[24498716,2449879
